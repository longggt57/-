<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자동화 시스템 글로우 맵</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 어두운 격자 캔버스 + 빛나는 연결선. ?s=0..6 으로 장면 선택. 1200×900 무대를 1.5배로 캡처. */
* { box-sizing: border-box; }
html, body { margin: 0; background: #05070b; }
.stage { width: 1200px; height: 900px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #121822 0%, #080b11 55%, #030406 100%); font-family: "Noto Sans KR", sans-serif; }
.plane { position: absolute; inset: -140px -160px; transform: perspective(1500px) rotateX(16deg) rotateZ(-3deg) scale(1.02); transform-origin: 50% 55%; }
.grid { position: absolute; inset: 0; background-image:
  linear-gradient(rgba(120, 150, 190, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 150, 190, .09) 1px, transparent 1px),
  linear-gradient(rgba(120, 150, 190, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 150, 190, .045) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 16px; background: linear-gradient(160deg, #262b35, #171a21); border: 1.5px solid #3b4250;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06); display: grid; place-items: center; }
.node svg { width: 38px; height: 38px; }
.node.trig { border-color: #ff5a4f; background: linear-gradient(160deg, #e43c34, #a91d18); box-shadow: 0 0 0 4px rgba(255, 70, 60, .18), 0 0 34px rgba(255, 70, 60, .75), 0 0 80px rgba(255, 70, 60, .35); }
.node.lit { border-color: #4be3a0; box-shadow: 0 0 0 3px rgba(75, 227, 160, .14), 0 0 26px rgba(75, 227, 160, .5); }
.node.hub { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 26px; border-color: #7cc8ff; box-shadow: 0 0 0 6px rgba(110, 190, 255, .12), 0 0 50px rgba(110, 190, 255, .55), 0 0 120px rgba(110, 190, 255, .25); }
.node.hub svg { width: 66px; height: 66px; }
.ring { position: absolute; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; border: 2px solid transparent; border-top-color: rgba(160, 215, 255, .8); border-left-color: rgba(160, 215, 255, .35); filter: drop-shadow(0 0 8px rgba(130, 200, 255, .8)); }
.lbl { position: absolute; transform: translate(-50%, 0); margin-top: 44px; color: #e9edf3; font-size: 14px; font-weight: 700; white-space: nowrap; text-align: center; text-shadow: 0 2px 6px #000; line-height: 1.3; }
.lbl small { display: block; font-size: 11px; color: #8f99a8; font-weight: 500; }
.lbl.big { margin-top: 70px; font-size: 18px; }
.dots { position: absolute; transform: translate(-50%, 0); margin-top: 82px; display: flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #9aa3b2; opacity: .8; } .dots i:nth-child(n+2) { opacity: .35; }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, .65) 100%); }
.cap { position: absolute; left: 44px; top: 36px; color: #fff; z-index: 3; }
.cap .k { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: #7cc8ff; }
.cap h1 { margin: 8px 0 6px; font-size: 30px; font-weight: 900; letter-spacing: -.01em; text-shadow: 0 2px 12px #000; }
.cap p { margin: 0; color: #a9b3c2; font-size: 15px; max-width: 46ch; line-height: 1.55; text-shadow: 0 2px 8px #000; }
</style>
</head>

// ───── 장면 ─────
// node: [id, x(0~100), y(0~100), icon, 라벨, 보조라벨, 종류]  edge: [from, to, color]
const B = '#47b4ff', G = '#3ddc97', W = '#cfe7ff', O = '#ffb24a';
const S = [
 { k: 'AUTOMATION SYSTEM', t: '자동화 시스템 전체 맵', d: '주문·문의·의뢰가 들어오면 n8n과 AI가 정리해서 시트·엑셀·알림·CRM으로 내보냅니다',

   n: [['a', 7, 4, 'shop', '스마트스토어'], ['b', 7, 22, 'coupang', '쿠팡'], ['c', 7, 40, 'mall', '카페24 · 자사몰'], ['d', 7, 58, 'hook', '고객 문의', '', 'trig'], ['e', 7, 76, 'form', '의뢰서 접수'], ['f', 7, 94, 'clock', '매일 08:30'],
       ['m', 27, 13, 'merge', '주문 합치기'], ['p', 27, 37, 'code', '합포장 · 주소 정리'], ['q', 27, 61, 'edit', '문의 내용 정리'], ['r', 27, 85, 'code', '매출 집계'],
       ['h', 50, 49, 'ai', 'AI 자동화 엔진', 'n8n + Claude', 'hub'],
       ['o1', 80, 0, 'sheet', '구글 시트 생성'], ['o2', 80, 16, 'xlsx', '택배 업로드 엑셀'], ['o3', 80, 32, 'gmail', '담당자 메일'], ['o4', 80, 48, 'slack', '슬랙 알림', '', 'lit'], ['o5', 80, 64, 'notion', '계약 DB'], ['o6', 80, 80, 'dash', 'CRM 대시보드', '', 'lit'], ['o7', 80, 96, 'gmail', '매출 리포트']],
   e: [['a', 'm', B], ['b', 'm', B], ['c', 'm', B], ['a', 'p', B], ['c', 'p', B], ['d', 'q', B], ['e', 'q', B], ['f', 'r', B], ['b', 'r', B], ['c', 'r', B],
       ['m', 'h', B], ['p', 'h', B], ['q', 'h', B], ['r', 'h', B], ['d', 'h', B], ['e', 'h', B],
       ['h', 'o1', W], ['h', 'o2', W], ['h', 'o3', W], ['h', 'o4', G], ['h', 'o5', W], ['h', 'o6', G], ['h', 'o7', W]] },

       ['x', 68, 30, 'xlsx', '택배 업로드 엑셀'], ['s', 68, 80, 'sheet', '구글 시트 생성'], ['g', 86, 55, 'gmail', '담당자 메일', '', 'lit']],
   e: [['t', 'a', B], ['t', 'b', B], ['a', 'm', B], ['b', 'm', B], ['m', 'c', B], ['c', 'x', W], ['c', 's', W], ['x', 'g', G], ['s', 'g', G]] },
 { k: 'SYSTEM 02', t: '새 주문 알림', d: '10분마다 새 주문을 확인해 시트에 기록하고 슬랙으로 알립니다',
   n: [['t', 9, 55, 'clock', '10분마다', '스케줄', 'trig'], ['a', 28, 55, 'shop', '신규 주문 조회'], ['i', 47, 55, 'branch', '새 주문 있음?'], ['s', 67, 32, 'sheet', '주문 시트 기록'], ['k', 87, 32, 'slack', '슬랙 알림', '', 'lit'], ['z', 67, 80, 'clock', '다음 확인 대기']],

 { k: 'SYSTEM 03', t: '고객 문의 AI 답변 초안', d: '문의가 들어오면 Claude가 분류하고 답변 초안을 쓰며, 급한 문의는 담당자를 바로 부릅니다',
   n: [['t', 8, 55, 'hook', '문의 접수', 'Webhook', 'trig'], ['a', 26, 55, 'edit', '문의 내용 정리'], ['h', 47, 55, 'ai', 'Claude', '분류 · 답변 초안', 'hub'], ['i', 67, 55, 'branch', '긴급 문의?'],
       ['k', 87, 28, 'slack', '담당자 호출', '', 'lit'], ['s', 87, 55, 'sheet', '답변 초안 저장'], ['g', 87, 82, 'gmail', '고객 회신 초안']],
   e: [['t', 'a', B], ['a', 'h', B], ['h', 'i', W], ['i', 'k', G], ['i', 's', W], ['i', 'g', W]] },
 { k: 'SYSTEM 04', t: '일일 매출 리포트', d: '매일 아침 어제 주문을 채널별로 집계해 리포트 메일을 보냅니다',
   n: [['t', 8, 55, 'clock', '매일 08:30', '스케줄', 'trig'], ['a', 26, 30, 'sheet', '스마트스토어 주문'], ['b', 26, 55, 'sheet', '쿠팡 주문'], ['c', 26, 80, 'sheet', '자사몰 주문'],

 { k: 'SYSTEM 05', t: '의뢰 분석 → 견적 · 계약 DB', d: '의뢰서를 Claude가 분석해 견적을 계산하고, 노션 계약 DB에 등록한 뒤 회신 초안을 만듭니다',

   e: [['t', 'a', B], ['t', 'b', B], ['t', 'c', B], ['t', 'd', B], ['a', 'm', B], ['b', 'm', B], ['c', 'm', B], ['d', 'm', B], ['m', 'h', W], ['h', 'u', G], ['h', 's', W], ['u', 'k', W], ['s', 'k', W]] },

const si = +(new URLSearchParams(location.search).get('s') || 0); const sc = S[si];
const plane = document.getElementById('plane'); const svg = document.getElementById('wires');
const PW = 1520, PH = 1180, X0 = 200, Y0 = sc.dense ? 268 : 250, XW = 1120, YH = sc.dense ? 680 : 720; // 평면 안 그리는 영역
const pos = {}; sc.n.forEach(([id, x, y]) => (pos[id] = [X0 + x / 100 * XW, Y0 + y / 100 * YH]));
const half = (id) => (sc.n.find((n) => n[0] === id)[6] === 'hub' ? 60 : 37);
let defs = `<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>`;
let g = '';
sc.e.forEach(([f, t, col], i) => {
  const [x1, y1] = pos[f], [x2, y2] = pos[t]; const a = x1 + half(f), b = x2 - half(t); const dx = Math.max(60, (b - a) * 0.5);
  const d = `M${a},${y1} C${a + dx},${y1} ${b - dx},${y2} ${b},${y2}`;
  const dim = col === '#5b6576';
  g += `<path d="${d}" stroke="${col}" stroke-width="${dim ? 1.5 : 7}" fill="none" opacity="${dim ? 0 : .28}" filter="url(#glow)"/>`;
  g += `<path d="${d}" stroke="${col}" stroke-width="${dim ? 1.4 : 1.8}" fill="none" opacity="${dim ? .5 : .85}"/>`;
  if (!dim) {
    const off = (i * 37) % 40;
    g += `<path d="${d}" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="0.1 ${14 + (i % 3) * 6}" stroke-dashoffset="${off}" fill="none" filter="url(#glow2)" opacity=".9"/>`;
    g += `<path d="${d}" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 ${14 + (i % 3) * 6}" stroke-dashoffset="${off}" fill="none"/>`;
  }
  g += `<circle cx="${a}" cy="${y1}" r="4" fill="#0d1016" stroke="#8b95a5" stroke-width="1.6"/><circle cx="${b}" cy="${y2}" r="4" fill="#0d1016" stroke="#8b95a5" stroke-width="1.6"/>`;
});
svg.setAttribute('viewBox', `0 0 ${PW} ${PH}`); svg.innerHTML = defs + g;
const sx = (x) => x / PW * 100 + '%', sy = (y) => y / PH * 100 + '%';
sc.n.forEach(([id, , , icon, label, sub, kind]) => {
  const [x, y] = pos[id];
  if (kind === 'hub') { const r = document.createElement('div'); r.className = 'ring'; r.style.left = sx(x); r.style.top = sy(y); plane.appendChild(r); }
  const el = document.createElement('div'); el.className = 'node ' + (kind || ''); el.style.left = sx(x); el.style.top = sy(y); el.innerHTML = IC[icon]; plane.appendChild(el);
  const l = document.createElement('div'); l.className = 'lbl' + (kind === 'hub' ? ' big' : ''); l.style.left = sx(x); l.style.top = sy(y); l.innerHTML = label + (sub ? `<small>${sub}</small>` : ''); plane.appendChild(l);
  if (kind !== 'hub' && !sc.dense) { const d = document.createElement('div'); d.className = 'dots'; d.style.left = sx(x); d.style.top = sy(y); d.style.marginTop = sub ? '98px' : '82px'; d.innerHTML = '<i></i><i></i><i></i><i></i>'; plane.appendChild(d); }
});
// 평면 크기를 PW×PH 비율로
plane.style.width = PW + 'px'; plane.style.height = PH + 'px'; plane.style.inset = 'auto'; plane.style.left = (1200 - PW) / 2 + 'px'; plane.style.top = (900 - PH) / 2 + (sc.dense ? 6 : 30) + 'px';
document.getElementById('cap').innerHTML = `<div class="k">${sc.k}</div><h1>${sc.t}</h1>${sc.dense ? '' : `<p>${sc.d}</p>`}`;
