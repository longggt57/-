<title>산들팜 통합 CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 관리자 화면 양식 — 하위 메뉴가 펼쳐지는 흰 사이드 메뉴 + 경로 표시 상단바 + 연회색 바탕 위 흰 카드.
   파란색은 실행 버튼, 채널 4색(파랑·주황·청록·보라)은 차트와 채널 배지에만. */
:root {
  --bg: #f4f6f9; --panel: #ffffff; --panel-2: #f7f8fb; --hover: #f1f4fa;
  --ink: #171c26; --ink-2: #3c4556; --muted: #6b7486; --line: #e6e9ef; --grid: #edf0f4;
  --primary: #2f6fed; --primary-ink: #ffffff; --primary-soft: #eaf1ff;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #6250d6;
  --good: #12804a; --good-bg: #e5f6ec; --warn: #a15c00; --warn-bg: #fff2dc; --crit: #c93535; --crit-bg: #fde8e8; --info: #2457c5; --info-bg: #e8effd; --mute-bg: #eff1f5;
  --ic-blue: #e8f0fe; --ic-green: #e3f6ec; --ic-violet: #efeafd; --ic-orange: #fff0e3; --ic-red: #fde9e9; --ic-teal: #e2f6f5;
  --shadow: 0 1px 2px rgba(23, 28, 38, .04);
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --panel: #1a1f2b; --panel-2: #202633; --hover: #232a39;
    --ink: #e7ebf3; --ink-2: #c3cad8; --muted: #8f99ac; --line: #2a3141; --grid: #252c3a;
    --primary: #5b8ff5; --primary-ink: #0b1220; --primary-soft: #1d2a45;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #9085e9;
    --good: #4cc38a; --good-bg: #163023; --warn: #f0b44c; --warn-bg: #33280f; --crit: #ff8a80; --crit-bg: #3a1d1d; --info: #8fb2ff; --info-bg: #1b2a48; --mute-bg: #262d3b;
    --ic-blue: #1d2a45; --ic-green: #163023; --ic-violet: #2a2445; --ic-orange: #3a2715; --ic-red: #3a1d1d; --ic-teal: #12312f; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --panel: #1a1f2b; --panel-2: #202633; --hover: #232a39;
  --ink: #e7ebf3; --ink-2: #c3cad8; --muted: #8f99ac; --line: #2a3141; --grid: #252c3a;
  --primary: #5b8ff5; --primary-ink: #0b1220; --primary-soft: #1d2a45;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #9085e9;
  --good: #4cc38a; --good-bg: #163023; --warn: #f0b44c; --warn-bg: #33280f; --crit: #ff8a80; --crit-bg: #3a1d1d; --info: #8fb2ff; --info-bg: #1b2a48; --mute-bg: #262d3b;
  --ic-blue: #1d2a45; --ic-green: #163023; --ic-violet: #2a2445; --ic-orange: #3a2715; --ic-red: #3a1d1d; --ic-teal: #12312f; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13.5px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
svg.i { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── 사이드 메뉴 ── */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding-left: env(safe-area-inset-left, 0px); }
.logo { display: flex; align-items: center; gap: 10px; padding: 16px 18px; font-weight: 700; font-size: 15px; }
.logo span { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 14px; }
.menu { padding: 4px 10px; display: grid; gap: 2px; overflow-y: auto; flex: 1; align-content: start; }
.menu a, .menu button.grp { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.menu a:hover, .menu button.grp:hover { background: var(--hover); }
.menu a.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.menu .grp .chev { margin-left: auto; transition: transform .15s; width: 14px; height: 14px; }
.menu .grp[aria-expanded="true"] .chev { transform: rotate(180deg); }
.menu .sub { display: grid; gap: 1px; margin: 1px 0 4px; }
.menu .sub a { padding: 6px 10px 6px 37px; font-size: 13px; }
.menu .cnt { margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; background: var(--crit); color: #fff; min-width: 18px; text-align: center; }
.me { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
.me .av { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.me b { display: block; font-size: 13px; } .me span { font-size: 11.5px; color: var(--muted); }

/* ── 상단바 ── */
.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.crumb { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.crumb b { color: var(--ink); font-weight: 600; }
.top .right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
.top .right b { color: var(--ink); font-weight: 600; }
.bell { position: relative; display: grid; place-items: center; }
.bell i { position: absolute; top: -2px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); }
.view { padding-block: 20px 40px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.ph h1 { font-size: 20px; font-weight: 700; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: env(safe-area-inset-right, 0px); }
  .menu { display: flex; overflow-x: auto; padding-bottom: 8px; }
  .menu > a, .menu button.grp { width: auto; white-space: nowrap; }
  .menu .sub { display: flex; }
  .menu .sub a { padding: 8px 10px; white-space: nowrap; }
  .menu .grp .chev { display: none; }
  .me { display: none; }
  .top, .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .right .who { display: none; }
}

/* ── 공통 요소 ── */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; }
.card-h h2 { font-size: 14.5px; font-weight: 700; }
.card-b { padding: 4px 18px 18px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 13px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; color: var(--ink-2); text-decoration: none; font-size: 13px; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.green { background: var(--good); border-color: var(--good); color: #fff; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.b-good { background: var(--good-bg); color: var(--good); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-crit { background: var(--crit-bg); color: var(--crit); } .b-info { background: var(--info-bg); color: var(--info); } .b-mute { background: var(--mute-bg); color: var(--muted); }
.chb { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; background: var(--mute-bg); color: var(--ink-2); }
.chb i { width: 7px; height: 7px; border-radius: 2px; }
.input, select.input { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 10px; min-height: 34px; }
.search { position: relative; display: inline-flex; align-items: center; }
.search svg { position: absolute; left: 10px; color: var(--muted); width: 15px; height: 15px; }
.search input { padding-left: 32px; min-width: 240px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--panel); border-color: var(--ink); color: var(--ink); }
.tab .n { font-size: 11px; background: var(--mute-bg); color: var(--muted); border-radius: 999px; padding: 0 6px; }
.tab.on .n { background: var(--ink); color: var(--panel); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; background: var(--panel-2); }
tr.rowx { cursor: pointer; }
tr.rowx:hover td { background: var(--hover); }
tr.rowx.open td { background: var(--primary-soft); }
td.r, th.r { text-align: right; }
td.w { white-space: normal; min-width: 220px; }
.chev-cell svg { transition: transform .15s; color: var(--muted); }
tr.open .chev-cell svg { transform: rotate(180deg); }
tr.detail > td { padding: 0; background: var(--panel-2); }
.empty { color: var(--muted); padding: 28px 8px; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }

/* ── 대시보드 ── */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.kpi .lbl { color: var(--muted); font-size: 12.5px; }
.kpi .val { font-size: 22px; font-weight: 700; line-height: 1.25; grid-column: 1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.kpi .sub b.up { color: var(--good); font-weight: 600; } .kpi .sub b.down { color: var(--crit); font-weight: 600; }
.ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; grid-column: 2; grid-row: 1 / span 2; }
.ic.blue { background: var(--ic-blue); color: var(--c1); } .ic.green { background: var(--ic-green); color: var(--good); } .ic.violet { background: var(--ic-violet); color: var(--c4); }
.ic.orange { background: var(--ic-orange); color: var(--c2); } .ic.red { background: var(--ic-red); color: var(--crit); } .ic.teal { background: var(--ic-teal); color: var(--c3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 1060px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.donut { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 190px); gap: 12px; align-items: center; }
@media (max-width: 560px) { .donut { grid-template-columns: minmax(0, 1fr); } }
.legend { display: grid; gap: 8px; font-size: 13px; }
.legend div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend .p { color: var(--muted); font-size: 12px; min-width: 36px; text-align: right; }
.chart-wrap { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0, 0, 0, .1); z-index: 5; white-space: nowrap; }
details.tbl summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ── 상세 펼침 ── */
.dgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 14px; }
@media (max-width: 1100px) { .dgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; white-space: normal; }
.box h4 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.box h4 a, .box h4 button { font-size: 12px; color: var(--primary); font-weight: 600; background: none; border: 0; cursor: pointer; padding: 0; }
.kv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 5px 10px; font-size: 12.5px; }
.kv span { color: var(--muted); }
.kv b { font-weight: 500; word-break: keep-all; }
.acts { display: grid; gap: 6px; }
.acts .btn { justify-content: flex-start; }
.dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.tagc { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
textarea.memo { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--panel); font-size: 12.5px; resize: vertical; }
.rounds { display: flex; gap: 4px; flex-wrap: wrap; }
.rounds i { width: 18px; height: 18px; border-radius: 5px; background: var(--mute-bg); font-style: normal; font-size: 10px; display: grid; place-items: center; color: var(--muted); }
.rounds i.d { background: var(--c3); color: #fff; } .rounds i.n { background: var(--primary-soft); color: var(--primary); outline: 1px solid var(--primary); }
.prog { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.prog .bar { width: 64px; height: 6px; background: var(--mute-bg); border-radius: 99px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--primary); }

/* ── 배송 스케줄 ── */
.mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .mini { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.slist { display: grid; gap: 8px; }
.sitem { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.sitem.done { border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.sitem.late { border-color: color-mix(in srgb, var(--crit) 35%, var(--line)); }
.shead { display: grid; grid-template-columns: auto minmax(0, 160px) minmax(0, 1fr) auto auto 20px; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; width: 100%; border: 0; background: none; text-align: left; }
.sitem.done .shead { background: color-mix(in srgb, var(--good-bg) 60%, var(--panel)); }
.sitem.open .shead { border-bottom: 1px solid var(--line); }
@media (max-width: 760px) { .shead { grid-template-columns: auto minmax(0, 1fr) auto 20px; } .shead .hide-sm { display: none; } }
.checks { width: 16px; height: 16px; accent-color: var(--primary); }
.users td b { font-weight: 600; }
.syncs { display: grid; gap: 6px; padding: 4px 18px 16px; font-size: 13px; }
.syncs .s { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; color: var(--ink-2); }
.syncs .s i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.syncs .s.done i { background: var(--good); border-color: var(--good); }
.syncs .s.run i { border-color: var(--primary); border-top-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .syncs .s.run i { animation: none; } .menu .grp .chev { transition: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
'use strict';
// ───────── 시간·형식 (KST) ─────────
const KST = 9 * 3600e3, MIN = 60e3, HOUR = 3600e3, DAY = 86400e3;
const kd = (ms) => new Date(ms + KST).toISOString().slice(0, 10);
const kt = (ms) => new Date(ms + KST).toISOString().slice(11, 16);
const kdt = (ms) => `${kd(ms)} ${kt(ms)}`;
const md = (ms) => { const d = kd(ms); return `${+d.slice(5, 7)}/${+d.slice(8, 10)}`; };
const dayStart = (ms) => Date.parse(kd(ms) + 'T00:00:00+09:00');
const parseD = (s) => Date.parse(s + 'T00:00:00+09:00');
const WD = '일월화수목금토';
const wd = (ms) => WD[new Date(ms + KST).getUTCDay()];
const won = (n) => `${Math.round(n).toLocaleString('ko-KR')}원`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const dg = (r, n) => Array.from({ length: n }, () => Math.floor(r() * 10)).join('');

// ───────── 아이콘 ─────────

function donut(el, items, centerLabel) {
  const total = items.reduce((s, x) => s + x.v, 0) || 1; const R = 74, r0 = 50, cx = 95, cy = 95;
  const surface = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
  let a0 = -Math.PI / 2; let paths = '';
  items.forEach((x) => {
    if (!x.v) return; const a1 = a0 + (x.v / total) * Math.PI * 2; const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (r, a) => `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
    const d = x.v === total ? `M${cx},${cy - R} A${R},${R} 0 1 1 ${cx - 0.01},${cy - R} L${cx - 0.01},${cy - r0} A${r0},${r0} 0 1 0 ${cx},${cy - r0} Z` : `M${p(R, a0)} A${R},${R} 0 ${large} 1 ${p(R, a1)} L${p(r0, a1)} A${r0},${r0} 0 ${large} 0 ${p(r0, a0)} Z`;
    paths += `<path d="${d}" fill="${x.c}" stroke="${surface}" stroke-width="2"><title>${esc(x.k)} ${x.v} (${Math.round(x.v / total * 100)}%)</title></path>`; a0 = a1;
  });
  el.innerHTML = `<div class="donut"><svg viewBox="0 0 190 190" width="100%" style="max-height:200px" role="img" aria-label="${esc(centerLabel)} 도넛 차트">${paths}<text x="95" y="90" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(centerLabel)}</text><text x="95" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${total.toLocaleString()}</text></svg>
    <div class="legend">${items.map((x) => `<div><i style="background:${x.c}"></i><span>${esc(x.k)}</span><b class="num">${x.v.toLocaleString()}</b><span class="p">${Math.round(x.v / total * 100)}%</span></div>`).join('')}</div></div>`;
}
function drawDash() {

  donut($('#donut2'), [['활성', 1], ['일시정지', 2], ['완료', 3], ['해지', 4]].map(([k, i]) => ({ k, v: S.subs.filter((s) => s.status === k).length, c: `var(--c${i})` })), '정기배송');
  const el = $('#bars'); const days = []; for (let t = a; t < b; t += DAY) days.push(t);
  const data = days.map((d) => ({ d, v: S.orders.filter((o) => o.at >= d && o.at < d + DAY && live(o)).reduce((s, o) => s + o.amount, 0) / 10000 }));
  const W = Math.max(300, el.clientWidth), H = 220, pl = 38, pr = 6, pt = 10, pb = 26;
  const max = Math.max(...data.map((x) => x.v), 1); const step = max > 80 ? 40 : max > 40 ? 20 : 10; const top = Math.ceil(max / step) * step;
  const y = (v) => pt + (H - pt - pb) * (1 - v / top); const bw = (W - pl - pr) / data.length; const barW = Math.max(3, Math.min(18, bw * 0.6));
  const cs = getComputedStyle(document.documentElement); const grid = cs.getPropertyValue('--grid').trim(), muted = cs.getPropertyValue('--muted').trim();
  const every = Math.ceil(data.length / 8);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="일별 매출 막대 차트">`;
  for (let v = 0; v <= top; v += step) svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${grid}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${muted}">${v}</text>`;
  data.forEach((x, i) => { const cx = pl + bw * i + bw / 2; const h = y(0) - y(x.v); const rr = Math.min(4, h / 2, barW / 2);
    if (h > 0) svg += `<path d="M${cx - barW / 2},${y(0)} v${-(h - rr)} q0,${-rr} ${rr},${-rr} h${barW - 2 * rr} q${rr},0 ${rr},${rr} v${h - rr} z" fill="var(--c1)"/>`;
    if ((i % every === 0 && i <= data.length - 1 - every / 2) || i === data.length - 1) svg += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${muted}">${md(x.d)}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${pl + bw * i}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>`; });
  el.innerHTML = svg + '</svg><div class="tip" hidden></div>';
  const tip = $('.tip', el);
  el.querySelectorAll('.hit').forEach((h) => { h.addEventListener('mouseenter', () => { const x = data[+h.dataset.i]; tip.innerHTML = `<b>${kd(x.d)} (${wd(x.d)})</b><br>매출 ${won(x.v * 10000)}`; tip.hidden = false; const bx = (+h.getAttribute('x') + bw / 2) / W * el.clientWidth; tip.style.left = Math.min(el.clientWidth - 150, Math.max(0, bx - 70)) + 'px'; tip.style.top = '4px'; }); h.addEventListener('mouseleave', () => (tip.hidden = true)); });
  $('#barsT').innerHTML = `<table><thead><tr><th>날짜</th><th class="r">매출</th></tr></thead><tbody>${data.map((x) => `<tr><td>${kd(x.d)}</td><td class="r num">${won(x.v * 10000)}</td></tr>`).join('')}</tbody></table>`;
}

  const today = dayStart(Date.now()); const active = S.subs.filter((s) => s.status === '활성');
  const late = active.filter((s) => s.next < today);
  const doneToday = S.subs.filter((s) => s.shippedToday);
  const dayList = [-1, 0, 1, 2, 3, 4, 5].map((o) => today + o * DAY);
  const itemsFor = (d) => d === today ? [...active.filter((s) => s.next >= d && s.next < d + DAY), ...doneToday.map((s) => ({ ...s, _done: true }))] : d < today ? late : active.filter((s) => s.next >= d && s.next < d + DAY);
  const all = ui.day === '전체' ? [...late, ...active.filter((s) => s.next >= today && s.next < today + 6 * DAY), ...doneToday.map((s) => ({ ...s, _done: true }))] : itemsFor(parseD(ui.day));
  const label = (d) => (d < today ? '연체' : d === today ? '오늘' : d === today + DAY ? '내일' : `${md(d)}(${wd(d)})`);
  const weekN = active.filter((s) => s.next < today + 7 * DAY).length + doneToday.length;
  return `<div class="ph"><h1>배송 스케줄</h1><span class="muted">${kd(today)} (${wd(today)}) 기준</span></div>
  <section class="mini">
    <div class="card kpi"><span class="lbl">이번 주 배송</span><span class="val">${weekN}</span><span class="ic blue">${ic('box')}</span></div>
    <div class="card kpi"><span class="lbl">오늘 예정</span><span class="val">${itemsFor(today).filter((x) => !x._done).length}</span><span class="ic green">${ic('cal')}</span></div>
    <div class="card kpi"><span class="lbl">연체</span><span class="val">${late.length}</span><span class="ic red">${ic('alert')}</span></div>
    <div class="card kpi"><span class="lbl">오늘 처리완료</span><span class="val">${doneToday.length}</span><span class="ic violet">${ic('check')}</span></div>
  </section>
  <section class="card"><div class="toolbar"><div class="days">
    <button class="tab ${ui.day === '전체' ? 'on' : ''}" type="button" data-day="전체">전체</button>
    ${dayList.map((d) => { const n = itemsFor(d).length; return `<button class="tab ${ui.day === kd(d) ? 'on' : ''}" type="button" data-day="${kd(d)}">${label(d)}${n ? `<span class="n">${n}</span>` : ''}</button>`; }).join('')}</div>
    <span class="muted">${ui.day === '전체' ? '연체 + 6일' : ui.day} · ${all.length}건</span></div>
    <div class="card-b" style="padding-top:14px"><div class="slist">${all.map((s) => { const c = cust(s.cid), p = prod(s.pid); const isLate = !s._done && s.next < today; const key = (s._done ? 'D' : '') + s.id; const open = ui.open === key;
      return `<div class="sitem ${s._done ? 'done' : ''} ${isLate ? 'late' : ''} ${open ? 'open' : ''}"><button class="shead" type="button" data-sched="${key}">
        ${s._done ? badge('활성', '완료') : isLate ? badge('취소', '연체') : badge('대기', '예정')}<b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</b><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">[${s.total}회 정기배송] ${esc(p.name)}${s.qty > 1 ? ` × ${s.qty}` : ''}</span><span class="muted hide-sm">${ic('clock')} ${s._done ? s.done : s.done + 1}회차</span><span class="muted num hide-sm">${s._done ? '오늘 출고' : md(s.next)}</span><span class="chev-cell" style="${open ? 'transform:rotate(180deg)' : ''}">${ic('chev')}</span></button>
        ${open ? `<div class="dgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
          <div class="box"><h4>주문자</h4><div class="kv"><span>이름</span><b>${esc(c.name)}</b><span>연락처</span><b>${esc(c.phone)}</b></div></div>
          <div class="box"><h4>수령인 / 배송지</h4><div class="kv"><span>수령인</span><b>${esc(s.receiver.name)}</b><span>주소</span><b>${esc(s.receiver.addr)}</b><span>메모</span><b>${esc(s.memo || '-')}</b></div></div>
          <div class="box"><h4>처리</h4>${s._done ? '<span class="muted">오늘 출고 처리됨 · 배송 대기 목록에 있습니다.</span>' : `<div class="acts"><button class="btn pri sm" type="button" data-shipsub="${s.id}">${s.done + 1}회차 출고 처리</button><button class="btn sm" type="button" data-sact="${s.id}|skip">이번 회차 건너뛰기</button></div>`}</div>
        </div>` : ''}</div>`; }).join('') || '<div class="empty">이 날짜에 예정된 배송이 없습니다.</div>'}</div></div></section>`;
}

// ───────── 배송관리 ─────────

  <section class="card"><div class="scroll"><table><thead><tr><th>주문번호</th><th>채널</th><th>수령인</th><th>상품</th><th>송장번호</th><th>상태</th><th>출고일</th></tr></thead><tbody>

// ───────── 고객·상품 ─────────
function custStats(c) { const os = S.orders.filter((o) => o.cid === c.id && live(o)); const subs = S.subs.filter((s) => s.cid === c.id && ['활성', '일시정지'].includes(s.status)); const total = os.reduce((s, o) => s + o.amount, 0);
  return { n: os.length, total, last: os.length ? Math.max(...os.map((o) => o.at)) : null, subs, grade: total >= 600000 ? 'VIP' : Date.now() - c.joined < 45 * DAY ? '신규' : '일반', os }; }
function viewCustomers() {
  const rows = S.customers.map((c) => ({ c, st: custStats(c) }));
  const tabs = ['전체', 'VIP', '일반', '신규', '정기구독'];
  const f = rows.filter(({ c, st }) => (ui.ctab === '전체' || (ui.ctab === '정기구독' ? st.subs.length : st.grade === ui.ctab)) && (!ui.cq || `${c.name} ${c.phone}`.includes(ui.cq))).sort((a, b) => b.st.total - a.st.total);

  <div class="scroll"><table><thead><tr><th>고객명</th><th>연락처</th><th>등급</th><th>첫 유입</th><th class="r">주문</th><th class="r">누적 구매액</th><th>정기배송</th><th>최근 주문</th><th></th></tr></thead><tbody>
  ${f.slice(0, 100).map(({ c, st }) => `<tr class="rowx ${ui.open === c.id ? 'open' : ''}" data-crow="${c.id}"><td><b>${esc(c.name)}</b> ${tagHtml(c.tags)}</td><td class="num">${esc(c.phone)}</td><td>${badge(st.grade)}</td><td>${chb(c.first)}</td><td class="r num">${st.n}</td><td class="r num">${won(st.total)}</td><td>${st.subs.length ? badge('활성', `${st.subs.length}건`) : '<span class="muted">-</span>'}</td><td class="num">${st.last ? kd(st.last) : '-'}</td><td class="chev-cell">${ic('chev')}</td></tr>
    ${ui.open === c.id ? `<tr class="detail"><td colspan="9"><div class="dgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="box"><h4>기본 정보</h4><div class="kv"><span>고객번호</span><b class="mono">${c.id}</b><span>가입일</span><b>${kd(c.joined)}</b><span>주소</span><b>${esc(c.addr)}</b></div><textarea class="memo" data-cmemo="${c.id}" placeholder="고객 메모">${esc(c.memo)}</textarea></div>
      <div class="box"><h4>최근 주문</h4><div class="kv">${st.os.sort((a, b) => b.at - a.at).slice(0, 5).map((o) => `<span>${md(o.at)}</span><b>${esc(prod(o.pid).name)} · ${badge(o.status)}</b>`).join('') || '<span>-</span><b>주문 없음</b>'}</div></div>
      <div class="box"><h4>정기배송</h4><div class="kv">${st.subs.map((s) => `<span>${s.done}/${s.total}회</span><b>${esc(prod(s.pid).name)} · ${s.cycle}주 · ${badge(s.status)}</b>`).join('') || '<span>-</span><b>없음</b>'}</div></div>
    </div></td></tr>` : ''}`).join('')}</tbody></table></div></section>`;
}
function viewProducts() {

// ───────── 설정 ─────────
function viewChannels() {

  return `<div class="ph"><h1>채널 연동</h1></div><section class="grid2">${CH.map((c, i) => { const n = S.orders.filter((o) => o.channel === c && o.at >= today).length; return `<div class="card"><div class="card-h"><h2 class="row">${chb(c)}</h2>${badge('성공', '연결됨')}</div><div class="card-b"><div class="kv"><span>연동 방식</span><b>${esc(CH_SRC[c])}</b><span>수집 주기</span><b>${i < 2 ? '하루 3회 (09·13·17시)' : '시트 입력 즉시'}</b><span>마지막 동기화</span><b>${last ? kdt(last.at) : '-'}</b><span>오늘 수집</span><b>${n}건</b></div></div></div>`; }).join('')}</section>`;

const syncLive = { steps: null };
function viewSync() {
  const L = syncLive.steps;
  return `<div class="ph"><h1>동기화</h1><button class="btn pri" type="button" id="syncNow" ${L && !L.done ? 'disabled' : ''}>${ic('refresh')}${L && !L.done ? '동기화 중…' : '지금 동기화'}</button></div>
  ${L ? `<section class="card"><div class="card-h"><h2>실행 단계</h2></div><div class="syncs">${L.list.map((s) => `<div class="s ${s.st}"><i></i><span>${esc(s.t)}${s.d ? ` <span class="muted">· ${esc(s.d)}</span>` : ''}</span><span class="muted mono">${s.ms ? s.ms + 'ms' : ''}</span></div>`).join('')}</div></section>` : ''}
  <section class="card"><div class="card-h"><h2>동기화 기록</h2><span class="muted" style="font-size:12px">하루 3회 자동 · n8n</span></div><div class="scroll"><table><thead><tr><th>시각</th><th>결과</th><th class="r">수집 주문</th><th>비고</th></tr></thead><tbody>
    ${[...S.runs].reverse().slice(0, 20).map((r) => `<tr><td class="num">${kdt(r.at)}</td><td>${badge(r.status)}</td><td class="r num">${r.n}건</td><td class="muted">${esc(r.note || '4개 채널 정상')}</td></tr>`).join('')}</tbody></table></div></section>`;
}
async function runSync() {
  const L = (syncLive.steps = { list: [], done: false }); const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = async (t, fn) => { const s = { t, st: 'run' }; L.list.push(s); render(); await new Promise((r) => setTimeout(r, reduce ? 0 : 350 + Math.random() * 350)); s.d = (await fn()) || ''; s.st = 'done'; s.ms = Math.round(150 + Math.random() * 600); render(); };
  let res;
  await step('카페24 자사몰 주문 조회', () => 'API');
  await step('네이버 스마트스토어 주문 조회', () => '커머스 API');
  await step('공동구매·전화주문 시트 읽기', () => '구글 시트');
  await step('중복 제거 · 고객 매칭', () => { res = collectOrders(true); return `새 주문 ${res.made.length}건`; });
  await step('정기배송 회차 확인', () => `오늘 예정 ${S.subs.filter((s) => s.status === '활성' && s.next >= dayStart(Date.now()) && s.next < dayStart(Date.now()) + DAY).length}건`);
  L.done = true; render(); toast(`동기화 완료 · ${res.by || '새 주문 없음'}`);
}

// ───────── 라우팅 ─────────
const VIEWS = { dashboard: viewDashboard, customers: viewCustomers, subs: viewSubs, schedule: viewSchedule, orders: viewOrders, 'ship-wait': viewShipWait, 'ship-status': viewShipStatus, products: viewProducts, channels: viewChannels, sync: viewSync, users: viewUsers };
const route = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : 'dashboard'; };
function render() {
  const r = route(); renderMenu(r);
  const fid = document.activeElement?.id; const caret = document.activeElement?.selectionStart;

matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => route() === 'dashboard' && drawDash());

// ───────── 이벤트 ─────────
const toggleOpen = (id) => { ui.open = ui.open === id ? null : id; ui.confirm = null; render(); };
document.addEventListener('click', async (e) => {
  const t = e.target; const d = (k) => t.closest(`[data-${k}]`)?.dataset[k.replace(/-([a-z])/g, (_, c) => c.toUpperCase())];
  if (t.closest('tr.detail') && !t.closest('button, a, input, select, textarea')) return;
  let v;
  if ((v = d('grp'))) { openGroups.has(v) ? openGroups.delete(v) : openGroups.add(v); render(); return; }
  if ((v = d('orow'))) return toggleOpen(v);
  if ((v = d('srow'))) return toggleOpen(v);
  if ((v = d('crow'))) return toggleOpen(v);
  if ((v = d('sched'))) return toggleOpen(v);
  if ((v = d('otab'))) { ui.otab = v; ui.open = null; render(); return; }
  if ((v = d('stab'))) { ui.stab = v; ui.open = null; render(); return; }
  if ((v = d('ctab'))) { ui.ctab = v; ui.open = null; render(); return; }
  if ((v = d('day'))) { ui.day = v; ui.open = null; render(); return; }
  if ((v = d('confirm'))) { ui.confirm = v; render(); return; }
  if ((v = d('ostat'))) { const [id, st] = v.split('|'); const o = S.orders.find((x) => x.id === id); o.status = st; if (st === '배송완료') o.doneAt = Date.now(); ui.confirm = null; save(); render(); toast(`${id} → ${st}`); return; }
  if ((v = d('stag'))) { const [id, k] = v.split('|'); const s = S.subs.find((x) => x.id === id); const i = s.tags.indexOf(+k); i >= 0 ? s.tags.splice(i, 1) : s.tags.push(+k); save(); render(); return; }
  if ((v = d('sact'))) {
    const [id, act] = v.split('|'); const s = S.subs.find((x) => x.id === id); const name = cust(s.cid).name;
    if (act === 'pause') { s.status = '일시정지'; toast(`${name}님 정기배송을 일시정지했습니다.`); }
    if (act === 'resume') { s.status = '활성'; if (!s.next || s.next < dayStart(Date.now())) s.next = dayStart(Date.now()) + DAY; toast(`${name}님 정기배송을 재개했습니다. 다음 배송 ${kd(s.next)}`); }
    if (act === 'cancel') { s.status = '해지'; s.next = null; toast(`${name}님 정기배송을 해지했습니다.`); }
    if (act === 'skip') { s.next += s.cycle * 7 * DAY; toast(`이번 회차를 건너뛰었습니다. 다음 배송 ${kd(s.next)}`); }
    ui.confirm = null; save(); render(); return;
  }
  if ((v = d('shipsub'))) {
    const s = S.subs.find((x) => x.id === v); const p = prod(s.pid); S.seq++;
    s.done++; s.hist.push({ round: s.done, date: Date.now() }); s.shippedToday = true;
    const o = { id: `${kd(Date.now()).replace(/-/g, '')}-${String(S.seq).padStart(7, '0')}`, channel: '자사몰', cid: s.cid, pid: s.pid, qty: s.qty, amount: s.price, status: '준비중', at: Date.now(), type: '정기배송', subId: s.id, tracking: '', memo: '' };
    S.orders.push(o); p.stock = Math.max(0, p.stock - s.qty);
    if (s.done >= s.total) { s.status = '완료'; s.next = null; } else s.next = Math.max(s.next, dayStart(Date.now())) + s.cycle * 7 * DAY;
    ui.open = null; save(); render(); toast(`${cust(s.cid).name}님 ${s.done}회차 출고 처리 · 배송 대기에 추가했습니다.`); return;
  }
  if ((v = d('sel'))) { t.checked ? ui.sel.add(v) : ui.sel.delete(v); render(); return; }
  const id = t.closest('button')?.id || t.id;
  if (id === 'selAll') { const list = S.orders.filter((o) => o.status === '준비중'); if (t.checked) list.forEach((o) => ui.sel.add(o.id)); else ui.sel.clear(); render(); }
  if (id === 'collect') { collectOrders(); ui.otab = '대기'; render(); }
  if (id === 'syncNow') runSync();
  if (id === 'invite') toast('초대 메일 기능은 실제 연동 시 활성화됩니다.');
  if (id === 'shipDone') { const r = rng(Date.now() & 0xffff); let n = 0; S.orders.filter((o) => ui.sel.has(o.id)).forEach((o) => { o.status = '배송중'; o.shipAt = Date.now(); o.tracking = `CJ ${dg(r, 4)}-${dg(r, 4)}-${dg(r, 4)}`; n++; }); ui.sel.clear(); save(); render(); toast(`${n}건 출고 완료 · 송장번호가 등록되었습니다.`); }
  if (id === 'trackRefresh') { let n = 0; S.orders.filter((o) => o.status === '배송중' && Date.now() - (o.shipAt || o.at) > 20 * HOUR).forEach((o) => { o.status = '배송완료'; o.doneAt = Date.now(); n++; }); save(); render(); toast(n ? `${n}건이 배송완료로 바뀌었습니다.` : '변경된 배송 상태가 없습니다.'); }
  if (id === 'xlsx' || id === 'copyT') {
    const rows = S.orders.filter((o) => ui.sel.has(o.id)).map((o) => { const c = cust(o.cid); const sub = o.subId && S.subs.find((s) => s.id === o.subId); const rc = sub ? sub.receiver : c; return [rc.name, rc.phone, rc.addr, prod(o.pid).name, o.qty, o.id, sub?.memo || o.memo || '']; });
    const head = ['받는분성명', '받는분전화번호', '받는분주소', '품목명', '내품수량', '고객주문번호', '배송메세지'];
    if (id === 'copyT') { try { await navigator.clipboard.writeText([head, ...rows].map((r) => r.join('\t')).join('\n')); toast(`${rows.length}줄을 복사했습니다. 엑셀 A1 칸에 붙여넣으세요.`); } catch { toast('복사가 막혔습니다. 엑셀 받기를 이용하세요.'); } }
    else if (window.XLSX) { const ws = XLSX.utils.aoa_to_sheet([head, ...rows]); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '송장등록'); try { XLSX.writeFile(wb, `${kd(Date.now())}_송장등록.xlsx`); toast('엑셀 저장을 시작했습니다. 막힌 화면에서는 표 복사를 이용하세요.'); } catch { toast('이 화면에서는 파일 저장이 막혀 있습니다. 표 복사를 이용하세요.'); } }
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'oq') { ui.oq = t.value.trim(); render(); } if (t.id === 'sq') { ui.sq = t.value.trim(); render(); } if (t.id === 'cq') { ui.cq = t.value.trim(); render(); }
  if (t.dataset.omemo) { S.orders.find((o) => o.id === t.dataset.omemo).memo = t.value; save(); }
  if (t.dataset.smemo) { S.subs.find((s) => s.id === t.dataset.smemo).memo = t.value; save(); }
  if (t.dataset.cmemo) { S.customers.find((c) => c.id === t.dataset.cmemo).memo = t.value; save(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'och') { ui.och = t.value; render(); } if (t.id === 'ofrom') { ui.ofrom = t.value; render(); } if (t.id === 'oto') { ui.oto = t.value; render(); }
  if (t.dataset.snext) { const s = S.subs.find((x) => x.id === t.dataset.snext); if (t.value) { s.next = parseD(t.value); save(); render(); toast(`다음 배송일을 ${t.value}로 바꿨습니다.`); } }
  if (t.dataset.scycle) { const s = S.subs.find((x) => x.id === t.dataset.scycle); s.cycle = +t.value; save(); render(); toast(`배송 주기를 ${t.value}주로 바꿨습니다.`); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'rangeF') { e.preventDefault(); const f = $('#dFrom').value, t = $('#dTo').value; if (f && t && f <= t) { ui.from = f; ui.to = t; render(); toast(`${f} ~ ${t} 기간으로 조회했습니다.`); } else toast('시작일이 종료일보다 늦습니다.'); } });
render();
})();
</script>
