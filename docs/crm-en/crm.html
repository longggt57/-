<title>Fernlight Support CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: left sidebar + right workspace. Shipping-label yellow marks only things to act on; buttons use ink. */
:root {
  --bg: #eef0f3;        
  --panel: #ffffff;
  --panel-2: #f6f7f9;
  --ink: #14181d;
  --ink-2: #3a424d;
  --muted: #5d6672;
  --line: #d9dde3;
  --label: #ffd23f;     
  --label-ink: #14181d;
  --btn: #14181d; --btn-ink: #ffffff;
  --s1: #2a78d6;        
  --s2: #eb6834;        
  --good: #0ca30c; --good-bg: #e7f6e7;
  --warn: #9a6700; --warn-bg: #fff4d6;
  --crit: #d03b3b; --crit-bg: #fdecec;
  --info-bg: #e8f0fb;
  --grid: #e9ecf0;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --panel: #1a1f26; --panel-2: #222831; --ink: #e8ebef; --ink-2: #c3c9d1; --muted: #9aa4b1; --line: #2e3540;
    --label: #f2c230; --label-ink: #14181d; --btn: #e8ebef; --btn-ink: #101317;
    --s1: #3987e5; --s2: #d95926;
    --good: #3fbf5a; --good-bg: #16301c; --warn: #f2c230; --warn-bg: #33290f; --crit: #ff7b7b; --crit-bg: #3a1d1d; --info-bg: #17263a; --grid: #262d36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --panel: #1a1f26; --panel-2: #222831; --ink: #e8ebef; --ink-2: #c3c9d1; --muted: #9aa4b1; --line: #2e3540;
  --label: #f2c230; --label-ink: #14181d; --btn: #e8ebef; --btn-ink: #101317;
  --s1: #3987e5; --s2: #d95926;
  --good: #3fbf5a; --good-bg: #16301c; --warn: #f2c230; --warn-bg: #33290f; --crit: #ff7b7b; --crit-bg: #3a1d1d; --info-bg: #17263a; --grid: #262d36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--s1); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }

.side {
  background: var(--panel); border-right: 1px solid var(--line);
  padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh;
}
.brand { display: grid; gap: 2px; padding: 0 6px; }
.brand b { font-size: 16px; }
.brand span { color: var(--muted); font-size: 12px; }
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--panel-2); }
.nav a.on { background: var(--ink); color: var(--panel); }
.nav .cnt { font-family: var(--mono); font-size: 12px; min-width: 22px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--panel-2); color: var(--ink); }
.nav a.on .cnt { background: var(--label); color: var(--label-ink); }
.nav .cnt.hot { background: var(--label); color: var(--label-ink); }
.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 6px; display: grid; gap: 8px; }


.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 14px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.top h1 { font-size: 20px; }
.top .meta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.demo { background: var(--label); color: var(--label-ink); font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.view { padding-block: 20px 40px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(14px, env(safe-area-inset-right, 0px)); gap: 10px; }
  .nav { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  .nav a { white-space: nowrap; }
  .side .foot { display: none; }
  .top, .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}


.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: 15px; }
.card-h small { color: var(--muted); font-size: 12.5px; }
.card-b { padding: 14px 16px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-weight: 500; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.pri { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.pri:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.info { background: var(--info-bg); color: var(--ink-2); }
.pill.mute { background: var(--panel-2); color: var(--muted); }
.pill.nodot::before { display: none; }
.ch { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ch i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.ch.s1 i { background: var(--s1); } .ch.s2 i { background: var(--s2); }
.tag { background: var(--label); color: var(--label-ink); font-weight: 700; font-size: 11.5px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
th { font-weight: 500; color: var(--muted); background: var(--panel-2); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.w { white-space: normal; min-width: 200px; }
td.r, th.r { text-align: right; }


.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis > :last-child { grid-column: span 2; } }
@media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .lbl { color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.kpi .val { font-family: var(--mono); font-size: 28px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
.kpi.todo { border-color: var(--label); box-shadow: inset 0 3px 0 var(--label); }
.dash { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1060px) { .dash { grid-template-columns: minmax(0, 1fr); } }
.chart-wrap { position: relative; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.tip {
  position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 140px; z-index: 5;
}
.tip b { display: block; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; }
.todo-list { display: grid; gap: 8px; }
.todo-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); }
.todo-item .ic { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-family: var(--mono); }
.todo-item .ic.y { background: var(--label); color: var(--label-ink); }
.todo-item .ic.r { background: var(--crit-bg); color: var(--crit); }
.todo-item .ic.g { background: var(--good-bg); color: var(--good); }
.todo-item b { display: block; }
.todo-item span { color: var(--muted); font-size: 12.5px; }
.timeline { display: grid; }
.tl { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.tl:last-child { border-bottom: 0; }
.tl .t { font-family: var(--mono); color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.tl b { font-weight: 500; }
.tl span.d { display: block; color: var(--muted); font-size: 12.5px; }


.wf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 980px) { .wf-grid { grid-template-columns: minmax(0, 1fr); } }
.wf { display: grid; grid-template-rows: auto auto 1fr auto; }
.wf .card-h h2 { display: flex; gap: 8px; align-items: center; }
.wf .no { font-family: var(--mono); background: var(--ink); color: var(--panel); border-radius: 5px; padding: 0 6px; font-size: 13px; }
.wf-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.wf-meta div { display: grid; gap: 1px; }
.wf-meta span { color: var(--muted); font-size: 12px; }
.wf-meta b { font-family: var(--mono); font-weight: 500; font-size: 13px; }
.steps { padding: 12px 16px; display: grid; gap: 4px; font-size: 13px; }
.steps .s { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; color: var(--ink-2); }
.steps .s .m { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.steps .s.done .m { border-color: var(--good); background: var(--good); }
.steps .s.run .m { border-color: var(--s1); border-top-color: transparent; animation: spin .7s linear infinite; }
.steps .s.fail .m { border-color: var(--crit); background: var(--crit); }
.steps .s .x { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.steps .s em { font-style: normal; color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
.strip { display: flex; gap: 3px; align-items: center; }
.strip i { width: 12px; height: 18px; border-radius: 3px; background: var(--good); opacity: .85; }
.strip i.w { background: var(--warn); }
.strip i.c { background: var(--crit); }
.wf-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.result { margin: 0 16px 12px; padding: 10px 12px; background: var(--panel-2); border-radius: 8px; font-size: 13px; }


.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--panel); }
.filters input[type=search], .filters select, .field input, .field textarea, .field select {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 10px;
}
.filters input[type=search] { min-width: 200px; }


.issue-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .issue-grid { grid-template-columns: minmax(0, 1fr); } }
.issue { border-left: 4px solid var(--crit); }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field textarea { width: 100%; }
.form { display: grid; gap: 10px; }


.cs { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .cs { grid-template-columns: minmax(0, 1fr); } }
.cs-list { display: grid; }
.cs-item { display: grid; gap: 3px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.cs-item:hover { background: var(--panel-2); }
.cs-item.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--ink); }
.cs-item .h { display: flex; justify-content: space-between; gap: 8px; }
.cs-item p { margin: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quote { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.draft { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); line-height: 1.6; }
.ai-box { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ai-box div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.ai-box span { font-size: 12px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; z-index: 20; max-width: calc(100% - 32px);
}
.cfg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .cfg { grid-template-columns: minmax(0, 1fr); } }
.conn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.conn:last-child { border-bottom: 0; }
.conn span { display: block; color: var(--muted); font-size: 12.5px; }
textarea.mono { font-family: var(--mono); font-size: 12.5px; min-height: 180px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .steps .s.run .m { animation: none; } }

/* ── CRM additions: inbox thread, customer panel, reviews, knowledge ── */
.inbox { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr) minmax(0, 270px); gap: 14px; align-items: start; }
@media (max-width: 1280px) { .inbox { grid-template-columns: minmax(0, 320px) minmax(0, 1fr); } .inbox .cust { grid-column: 1 / -1; } }
@media (max-width: 900px) { .inbox { grid-template-columns: minmax(0, 1fr); } }
.list { max-height: 720px; overflow-y: auto; }
.conv { display: grid; gap: 3px; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; }
.conv:hover { background: var(--panel-2); }
.conv.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--ink); }
.conv .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.conv .h b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv p { margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.conv.unread .h > b::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--s1); margin-left: 6px; vertical-align: middle; }
.chan { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.thread { display: grid; gap: 12px; padding: 16px; }
.msg { max-width: 82%; padding: 10px 13px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; }
.msg.in { background: var(--panel-2); border-top-left-radius: 4px; }
.msg.out { background: var(--ink); color: var(--panel); margin-left: auto; border-top-right-radius: 4px; }
.msg small { display: block; font-size: 11.5px; opacity: .7; margin-top: 4px; }
.ai { border-top: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 10px; }
.ai-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ai-row div { background: var(--panel-2); border-radius: 8px; padding: 7px 10px; display: grid; gap: 1px; }
.ai-row span { font-size: 11.5px; color: var(--muted); }
.ai-row b { font-size: 13.5px; }
.tone { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tone button { border: 0; background: var(--panel); padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.tone button.on { background: var(--ink); color: var(--panel); }
.cust .card-b { display: grid; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--label); color: var(--label-ink); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.kv span { color: var(--muted); }
.kv b { font-weight: 500; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tagx { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.tagx.vip { background: var(--label); color: var(--label-ink); border-color: transparent; font-weight: 700; }
.tagx.risk { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.hist { display: grid; gap: 6px; font-size: 12.5px; }
.hist div { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); }
.stars { color: #e3a008; letter-spacing: 1px; white-space: nowrap; }
.stars i { color: var(--line); font-style: normal; }
.rv-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .rv-grid { grid-template-columns: minmax(0, 1fr); } }
.dist { display: grid; gap: 8px; }
.dist .r { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 13px; }
.dist .bar { height: 10px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.dist .bar i { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.review { display: grid; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.review:last-child { border-bottom: 0; }
.review .h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.review p { margin: 0; }
.reply { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.reply textarea { width: 100%; min-height: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); line-height: 1.55; }
.cat { display: grid; gap: 9px; }
.cat .r { display: grid; grid-template-columns: 130px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13px; }
.cat .bar { height: 12px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.cat .bar i { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.kb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .kb { grid-template-columns: minmax(0, 1fr); } }
.kb textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); line-height: 1.55; }

<script>
(() => {
'use strict';
// ───────────── Time helpers (viewer's local time) ─────────────
const TZ = -new Date().getTimezoneOffset() * 60e3, MIN = 60e3, HOUR = 3600e3, DAY = 86400e3;
const kd = (ms) => new Date(ms + TZ).toISOString().slice(0, 10);
const kt = (ms) => new Date(ms + TZ).toISOString().slice(11, 16);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const md = (ms) => { const d = kd(ms); return `${MON[+d.slice(5, 7) - 1]} ${+d.slice(8, 10)}`; };
const kdt = (ms) => `${md(ms)} ${kt(ms)}`;
const dayStart = (ms) => new Date(kd(ms) + 'T00:00:00').getTime();
const wd = (ms) => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(ms + TZ).getUTCDay()];
const ago = (ms) => { const m = Math.round((Date.now() - ms) / MIN); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : md(ms); };
const usd = (n) => `$${Math.round(n).toLocaleString('en-US')}`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const fmtMin = (m) => (m < 60 ? `${Math.round(m)}m` : `${(m / 60).toFixed(1)}h`);
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ───────────── Sample content ─────────────
const PEOPLE = [
  ['Megan Clarke', 'Austin, TX'], ['Daniel Brooks', 'Denver, CO'], ['Aisha Rahman', 'Chicago, IL'], ['Jordan Lee', 'Seattle, WA'], ['Sofia Alvarez', 'Miami, FL'],
  ['Hannah Moore', 'Portland, OR'], ['Chris Walker', 'Boston, MA'], ['Priya Nair', 'San Jose, CA'], ['Tyler Grant', 'Atlanta, GA'], ['Emily Chen', 'New York, NY'],
  ['Marcus Bell', 'Phoenix, AZ'], ['Laura Kim', 'Minneapolis, MN'], ['Nina Patel', 'Raleigh, NC'], ['Ryan Scott', 'Nashville, TN'], ['Olivia Ross', 'San Diego, CA'],
  ['Kevin Diaz', 'Dallas, TX'], ['Grace Hall', 'Columbus, OH'], ['Ben Turner', 'Salt Lake City, UT'], ['Zoe Martin', 'Philadelphia, PA'], ['Sam Rivera', 'Tampa, FL'],
];
const PRODUCTS = ['Vitamin C Brightening Serum', 'Daily Barrier Moisturizer', 'Gentle Foaming Cleanser', 'Overnight Repair Mask', 'Mineral SPF 30', 'Travel Kit'];
// [category, urgency, sentiment, needsHuman, reason, subject, message, draft(friendly), draft(concise)]
const TEMPLATES = [
  ['Shipping', 'Medium', 'Neutral', false, '', 'Where is my order?', 'Hi, I ordered 6 days ago and the tracking hasn\'t moved since Monday. Can you check where my package is?',
    'Hi {first}, thanks for reaching out and sorry for the wait! I checked order {order}: it left our warehouse on time, but the carrier scan has been paused since Monday. I\'ve opened a trace with the carrier and will email you an update within 24 hours. If it doesn\'t move by Friday, we\'ll send a replacement right away.',
    'Hi {first}, order {order} shipped on time but the carrier scan stalled Monday. I\'ve opened a trace and will update you within 24 hours. If it hasn\'t moved by Friday, we\'ll ship a replacement.'],
  ['Returns', 'High', 'Negative', true, 'Skin reaction mentioned: needs a person', 'Reaction to the serum', 'I used the Vitamin C serum for three days and my cheeks got red and itchy. I want to return it.',
    'Hi {first}, I\'m so sorry about the irritation. Please stop using the serum, and if the redness doesn\'t settle, check with a doctor. You don\'t need to send the bottle back: I can refund you in full right away. Would you like a refund or to try our fragrance-free Barrier Moisturizer instead?',
    'Hi {first}, sorry about the irritation. Please stop using the serum. No need to return it: I can refund you in full or send our fragrance-free moisturizer instead. Which do you prefer?'],
  ['Product question', 'Low', 'Neutral', false, '', 'Sensitive skin?', 'Is the Daily Barrier Moisturizer okay for really sensitive skin? I react to most fragrances.',
    'Hi {first}, great question! The Daily Barrier Moisturizer is fragrance-free and dermatologist-tested on sensitive skin. We still suggest a patch test on your inner arm for 24 hours first. Happy to help if you have any other questions!',

  ['Damaged item', 'High', 'Negative', true, 'Damaged item: approve replacement', 'Bottle arrived leaking', 'My cleanser arrived with the pump broken and half of it leaked into the box.',
    'Hi {first}, I\'m sorry your cleanser arrived like that! Could you reply with a quick photo of the bottle? As soon as I have it, I\'ll ship a replacement at no cost. No need to send the damaged one back.',

  ['Order change', 'High', 'Neutral', false, '', 'Wrong address', 'I just placed an order and used my old address by mistake. Can you change it?',

    'Hi {first}, order {order} hasn\'t shipped. Reply with the correct address and I\'ll update it today.'],
  ['Discount', 'Low', 'Neutral', false, '', 'Code not working', 'The code WELCOME15 from your email says it\'s invalid at checkout.',
    'Hi {first}, sorry about that! WELCOME15 works on first orders over $30, so it may not apply if the cart is below that. I\'ve added a 15% credit to your account so you can use it on your next order anytime.',
    'Hi {first}, WELCOME15 applies to first orders over $30. I\'ve added a 15% credit to your account for your next order.'],
  ['Feedback', 'Low', 'Positive', false, '', 'Love the moisturizer', 'Just wanted to say the moisturizer has completely changed my winter skin. Will you restock the travel size?',
    'Hi {first}, this made our day, thank you! The travel size is back in stock next week. I\'ve added you to the restock alert so you\'ll get an email the moment it\'s live.',
    'Hi {first}, thank you! The travel size restocks next week, and I\'ve added you to the alert.'],
  ['Product question', 'Low', 'Neutral', false, '', 'Is it vegan?', 'Is the Gentle Foaming Cleanser vegan and cruelty-free?',
    'Hi {first}, yes! The Gentle Foaming Cleanser is vegan and cruelty-free, and none of our products are tested on animals. You can find the full ingredient list on the product page.',
    'Hi {first}, yes: it\'s vegan and cruelty-free. Full ingredients are on the product page.'],

    'Hi {first}, I\'m on it. If order {order} hasn\'t left the warehouse I\'ll cancel it and refund you in full. If it has already shipped, you can return it unopened within 30 days for a full refund. I\'ll confirm which applies within the hour.',
    'Hi {first}, I\'ll cancel order {order} if it hasn\'t shipped and refund you. If it has, you can return it unopened within 30 days. I\'ll confirm within the hour.'],
];
const CHANNELS = ['Email', 'Chat', 'Amazon', 'Email', 'Chat', 'Email'];
// [rating, product, text, draft]
const REVIEW_T = [
  [5, 0, 'Brighter skin in two weeks. Worth every penny.', 'Thank you, {first}! Two weeks is right when most people start seeing the glow. We\'re so glad it\'s working for you.'],
  [4, 1, 'Really nice texture and no greasy feel. A little pricey though.', 'Thanks for the honest review, {first}! Tip: the subscribe option saves 15% on every refill if you\'d like to keep it in your routine.'],
  [2, 0, 'Broke me out on my chin after a week. Not for me.', 'Hi {first}, we\'re sorry the serum didn\'t agree with your skin. Please reach out to our team: we\'ll make it right with a refund or an exchange for something gentler.'],
  [1, 4, 'Took almost two weeks to arrive. Product is fine but shipping was awful.', 'Hi {first}, we\'re sorry about the slow delivery; that\'s not the experience we want for you. Our team has reached out by email with a credit for your next order.'],
  [5, 5, 'Bought as a gift for my sister and she loved the packaging.', 'That\'s lovely to hear, {first}! Thank you for sharing Fernlight with your sister.'],
  [3, 3, 'Works well but the scent is stronger than I expected.', 'Thanks for the feedback, {first}! The mask has a light lavender note. If you prefer unscented, our Daily Barrier Moisturizer is fragrance-free.'],
  [5, 2, 'Gentle, rinses clean, and lasts forever.', 'Thank you, {first}! A little goes a long way with this one. We appreciate the review.'],
  [4, 4, 'No white cast, which is rare for mineral sunscreen.', 'Thanks, {first}! Getting rid of the white cast took a lot of testing, so this means a lot to us.'],
];

function buildState() {
  const r = rng(20261106);
  const now = Date.now();
  const customers = PEOPLE.map(([name, loc], i) => {
    const orders = 1 + Math.floor(r() * 9);
    const ltv = orders * (28 + r() * 40);
    const since = now - (40 + Math.floor(r() * 700)) * DAY;
    const seg = orders >= 7 ? 'VIP' : orders === 1 ? 'New' : 'Regular';
    return { id: 'C' + (i + 1), name, loc, email: `${name.split(' ')[0].toLowerCase()[0]}***@${['gmail.com', 'outlook.com', 'yahoo.com', 'icloud.com'][i % 4]}`, orders, ltv, since, seg, tags: [] };
  });
  customers[1].tags.push('At risk'); customers[3].tags.push('At risk');
  customers.forEach((c) => { if (c.orders >= 4 && r() < 0.5) c.tags.push('Subscriber'); });
  let ord = 40100;
  const convs = [];
  // Recent conversations (full detail)
  const live = [
    [0, 1, 25, 'Open'], [1, 2, 70, 'Open'], [2, 3, 130, 'Open'], [3, 6, 190, 'Open'], [4, 7, 260, 'Open'], [5, 11, 330, 'Open'],
    [6, 0, 420, 'Waiting'], [7, 4, 520, 'Resolved'], [8, 5, 640, 'Resolved'], [9, 9, 760, 'Resolved'], [10, 8, 900, 'Resolved'], [11, 10, 1100, 'Resolved'],
  ];
  live.forEach(([ci, ti, minsAgo, status], k) => {
    const t = TEMPLATES[ti]; const c = customers[ci]; ord += 7 + Math.floor(r() * 30);
    const at = now - minsAgo * MIN; const first = c.name.split(' ')[0]; const order = `#${ord}`;
    const fill = (s) => s.replace(/\{first\}/g, first).replace(/\{order\}/g, order);
    const conv = { id: 'T' + (1000 + k), cid: c.id, channel: CHANNELS[k % CHANNELS.length], subject: t[5], category: t[0], urgency: t[1], sentiment: t[2],
      needsHuman: t[3], reason: t[4], order, at, status, unread: status === 'Open' && k % 2 === 0,
      messages: [{ from: 'in', text: t[6], at }], drafts: { Friendly: fill(t[7]), Concise: fill(t[8]) }, tone: 'Friendly' };
    if (status !== 'Open') {
      const frt = 3 + r() * 16;
      conv.messages.push({ from: 'out', text: conv.drafts.Friendly, at: at + frt * MIN, by: 'Sent after review' });
      conv.frt = frt;
    }
    convs.push(conv);
  });
  // 14-day history for charts
  const history = [];
  for (let d = 14; d >= 1; d--) {
    const base = dayStart(now) - d * DAY; const weekend = ['Sat', 'Sun'].includes(wd(base));
    const total = Math.round((weekend ? 14 : 24) + r() * 10);
    const ai = Math.round(total * (0.62 + r() * 0.12) + (14 - d) * 0.3);
    history.push({ d: base, ai: Math.min(ai, total), manual: Math.max(0, total - ai), frt: 7 + r() * 4 + d * 0.9, csat: 4.4 + r() * 0.4 });
  }
  const catCounts = { Shipping: 41, Returns: 18, 'Product question': 36, Billing: 9, Subscription: 22, 'Order change': 15, Discount: 12, 'Damaged item': 7, Feedback: 14, Wholesale: 3 };
  // Reviews
  const reviews = REVIEW_T.map(([rating, p, text, draft], i) => {
    const c = customers[(i * 3 + 2) % customers.length]; const first = c.name.split(' ')[0];
    return { id: 'R' + (i + 1), cid: c.id, rating, product: PRODUCTS[p], text, at: now - (i * 190 + 40) * MIN, status: i >= 5 ? 'Replied' : 'Needs reply', draft: draft.replace(/\{first\}/g, first), source: i % 3 === 0 ? 'Amazon' : 'Website' };
  });
  const ratingHist = { 5: 312, 4: 141, 3: 38, 2: 17, 1: 11 };
  const runs = [];
  for (let d = 7; d >= 1; d--) {
    const day = dayStart(now) - d * DAY;
    runs.push({ wf: 'reviews', at: day + 9 * HOUR + 5 * MIN, status: 'Success', dur: 5 + r() * 3, summary: `${2 + Math.floor(r() * 4)} reviews → reply drafts` });
    runs.push({ wf: 'crm', at: day + 2 * HOUR, status: d === 4 ? 'Retried' : 'Success', dur: 11 + r() * 5, summary: d === 4 ? 'Shopify API rate limit → succeeded on retry' : `${30 + Math.floor(r() * 40)} customer profiles updated` });
    if (wd(day) === 'Mon') runs.push({ wf: 'report', at: day + 9 * HOUR, status: 'Success', dur: 6.2, summary: 'Weekly support report sent' });
  }
  convs.slice().reverse().forEach((c) => {
    runs.push({ wf: 'triage', at: c.at + 20e3, status: 'Success', dur: 3 + r() * 3, summary: `${c.category} · ${c.urgency}${c.needsHuman ? ' → needs a person' : ' → draft ready'}` });
    if (c.needsHuman) runs.push({ wf: 'escalate', at: c.at + 40e3, status: 'Success', dur: 1.4, summary: `${c.reason.split(':')[0]} → Slack #support-urgent` });
  });
  runs.sort((a, b) => a.at - b.at);
  return { v: 1, createdAt: now, customers, convs, history, catCounts, reviews, ratingHist, runs, queue: [1, 6, 9], rqueue: [[5, 1, 'Absorbs fast and my skin feels calm. Repurchasing.', 'Thank you, {first}! Calm skin is exactly what we hoped for. See you at your next refill.']], kb: KB, seq: 2000, ord };
}
const KB = {
  'Shipping': 'Orders ship within 1 business day. Standard delivery 3–5 business days, free over $40. If tracking stalls for 3+ days, open a carrier trace and offer a replacement after 5 days.',
  'Returns & refunds': '30-day returns on unopened items. Opened items: refund or exchange if the customer had a reaction or is unhappy; no need to return the product. Always advise stopping use after a reaction.',
  'Subscriptions': 'Subscribers save 15%. They can skip, swap or cancel anytime under Subscriptions in their account. Agents may skip a delivery on request.',
  'Tone & escalation': 'Warm, plain language, no medical claims. Escalate to a person: skin reactions, billing errors, damaged items, wholesale leads, cancellations after shipping.',
};

// ───────────── State ─────────────
const KEY = 'fernlight-crm-v1';
let S;
try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); if (p && p.v === 1 && Date.now() - p.createdAt < 20 * HOUR) S = p; } } catch {}
if (!S) S = buildState();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
save();
const cust = (id) => S.customers.find((c) => c.id === id);

// ───────────── Shared UI ─────────────
const WF = {
  triage: { name: 'Inquiry triage & reply drafts', trigger: 'On every new message', desc: 'Sorts each message by topic, urgency and tone, then writes a reply draft from your policies.' },
  escalate: { name: 'Escalation & routing', trigger: 'When a person is needed', desc: 'Sends refunds, reactions, billing and sales leads to the right person in Slack.' },
  reviews: { name: 'Review reply drafts', trigger: 'Daily 9:05 AM', desc: 'Collects new website and Amazon reviews and drafts on-brand replies.' },
  crm: { name: 'Customer profile sync', trigger: 'Nightly 2:00 AM', desc: 'Updates orders, lifetime value and segments from Shopify.' },
  report: { name: 'Weekly support report', trigger: 'Mondays 9:00 AM', desc: 'Volume, response time, top topics and review score, emailed to the team.' },
};
const ROUTES = [['dashboard', 'Dashboard'], ['inbox', 'Inbox'], ['reviews', 'Reviews'], ['customers', 'Customers'], ['automations', 'Automations'], ['knowledge', 'Policies'], ['config', 'Connections']];
const PILL = { Open: 'warn', Waiting: 'info', Resolved: 'good', High: 'crit', Medium: 'warn', Low: 'mute', Success: 'good', Retried: 'warn', Failed: 'crit', 'Needs reply': 'warn', Replied: 'good' };
const pill = (s, label) => `<span class="pill ${PILL[s] || 'mute'}">${esc(label || s)}</span>`;
const stars = (n) => `<span class="stars" aria-label="${n} out of 5">${'★'.repeat(n)}<i>${'★'.repeat(5 - n)}</i></span>`;
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3600); }
const counts = () => ({
  open: S.convs.filter((c) => c.status === 'Open').length,
  urgent: S.convs.filter((c) => c.status === 'Open' && c.needsHuman).length,
  reviews: S.reviews.filter((r) => r.status === 'Needs reply').length,
});
function renderNav(route) {
  const c = counts(); const badge = { inbox: c.open, reviews: c.reviews }; const hot = { inbox: c.urgent > 0, reviews: c.reviews > 0 };
  $('#nav').innerHTML = ROUTES.map(([k, l]) => `<a href="#${k}" class="${k === route ? 'on' : ''}" ${k === route ? 'aria-current="page"' : ''}>${l}${badge[k] ? `<span class="cnt ${hot[k] ? 'hot' : ''}">${badge[k]}</span>` : ''}</a>`).join('');
}

// ───────────── Dashboard ─────────────
function viewDashboard() {
  const c = counts();
  const today0 = dayStart(Date.now());
  const todayConvs = S.convs.filter((x) => x.at >= today0);
  const resolved = S.convs.filter((x) => x.frt != null);
  const frts = resolved.map((x) => x.frt).sort((a, b) => a - b);
  const medFrt = frts.length ? frts[Math.floor(frts.length / 2)] : 0;
  const last7 = S.history.slice(-7);
  const tot7 = last7.reduce((s, d) => s + d.ai + d.manual, 0), ai7 = last7.reduce((s, d) => s + d.ai, 0);
  const prev7 = S.history.slice(-14, -7); const frtPrev = prev7.reduce((s, d) => s + d.frt, 0) / 7, frtNow = last7.reduce((s, d) => s + d.frt, 0) / 7;
  const rt = Object.entries(S.ratingHist); const nR = rt.reduce((s, [, v]) => s + v, 0); const avgR = rt.reduce((s, [k, v]) => s + k * v, 0) / nR;
  const cats = Object.entries(S.catCounts).sort((a, b) => b[1] - a[1]); const maxC = cats[0][1];
  const urgentList = S.convs.filter((x) => x.status === 'Open' && x.needsHuman).slice(0, 4);
  return `
  <section class="kpis" aria-label="Today">
    <div class="card kpi"><div class="lbl">New messages today</div><div class="val">${todayConvs.length}</div><div class="sub">${S.history.slice(-1)[0] ? `${S.history.slice(-1)[0].ai + S.history.slice(-1)[0].manual} yesterday` : ''}</div></div>
    <div class="card kpi ${c.open ? 'todo' : ''}"><div class="lbl">Open conversations ${c.urgent ? pill('High', `${c.urgent} urgent`) : ''}</div><div class="val">${c.open}</div><div class="sub">Reply drafts ready</div></div>
    <div class="card kpi"><div class="lbl">First response (median)</div><div class="val">${fmtMin(medFrt)}</div><div class="sub">7-day avg ${fmtMin(frtNow)} · was ${fmtMin(frtPrev)}</div></div>
    <div class="card kpi"><div class="lbl">Sent from AI drafts</div><div class="val">${Math.round(ai7 / tot7 * 100)}<small>%</small></div><div class="sub">${ai7} of ${tot7} replies, last 7 days</div></div>
    <div class="card kpi"><div class="lbl">Review score</div><div class="val">${avgR.toFixed(2)}</div><div class="sub">${stars(Math.round(avgR))} ${nR} reviews</div></div>
  </section>
  <section class="dash">
    <div class="card">
      <div class="card-h"><h2>Replies per day <small>last 14 days</small></h2><div class="legend"><span class="ch s1"><i></i>From AI draft</span><span class="ch s2"><i></i>Written manually</span></div></div>
      <div class="card-b"><div class="chart-wrap" id="chart"></div>
        <details><summary class="muted" style="cursor:pointer;font-size:12.5px">Show as table</summary><div class="scroll" id="chartTable"></div></details></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Needs a person</h2><a class="btn sm" href="#inbox">Open inbox</a></div>
      <div class="card-b todo-list">${urgentList.map((x) => `<a class="todo-item" style="text-decoration:none;color:inherit" href="#inbox" data-open="${x.id}"><div class="ic r">!</div><div><b>${esc(cust(x.cid).name)} · ${esc(x.subject)}</b><span>${esc(x.reason)}</span></div><span class="chan">${esc(x.channel)}</span></a>`).join('') || '<div class="todo-item"><div class="ic g">✓</div><div><b>Nothing urgent</b><span>All escalations handled</span></div><span></span></div>'}</div>
    </div>
  </section>
  <section class="dash">
    <div class="card"><div class="card-h"><h2>Top topics <small>last 30 days</small></h2></div>

function drawChart() {

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
async function runWorkflow(id) {
  if (live[id] && !live[id].done) return;
  const L = (live[id] = { steps: [], done: false, result: '' }); const at = Date.now(); const t0 = performance.now();

  const step = async (t, fn) => { const s = { t, st: 'run', d: '' }; L.steps.push(s); paint(); await new Promise((r) => setTimeout(r, reduce ? 0 : 320 + Math.random() * 380)); s.d = (await fn()) || ''; s.st = 'done'; s.ms = Math.round(120 + Math.random() * 600); paint(); };
  if (route() !== 'automations') location.hash = 'automations'; else render();
  let summary = '';
  if (id === 'triage') {

    if (ti != null) {

      await step('Match customer profile', () => `${p.name} · ${p.seg} · ${plural(p.orders, 'order')}`);
      await step('Classify topic, urgency and tone', () => `${t[0]} · ${t[1]} · ${t[2]}`);
      await step('Write reply draft from policies', () => '2 tones: friendly, concise');
      await step(t[3] ? 'Route to a person (Slack)' : 'Place in inbox', () => (t[3] ? t[4] : 'Draft ready for review'));
      S.convs.push(conv); if (t[3]) S.runs.push({ wf: 'escalate', at: Date.now(), status: 'Success', dur: 1.3, summary: `${t[4].split(':')[0]} → Slack #support-urgent` });
      summary = `${t[0]} · ${t[1]}${t[3] ? ' → needs a person' : ' → draft ready'}`;

    } else { summary = 'No new messages'; L.result = 'No new messages right now.'; }
  } else if (id === 'escalate') {

    await step('Scan open conversations', () => plural(xs.length, 'needs a person', 'need a person'));
    await step('Post to Slack #support-urgent', () => (xs.length ? xs.map((c) => c.category).join(', ') : 'Nothing to send'));
    await step('Assign owners', () => (xs.length ? 'Refunds → Dana · Wholesale → Luis' : '-'));
    summary = xs.length ? `${plural(xs.length, 'conversation')} routed` : 'Nothing to route'; L.result = summary;
  } else if (id === 'reviews') {
    const q = S.rqueue.shift();
    await step('Fetch new reviews', () => (q ? 'Website + Amazon · 1 new' : 'No new reviews'));
    if (q) {
      const p = S.customers[(S.seq + 3) % S.customers.length]; S.seq++;

      S.reviews.unshift({ id: 'R' + S.seq, cid: p.id, rating: q[0], product: PRODUCTS[q[1]], text: q[2], at: Date.now(), status: 'Needs reply', draft: q[3].replace(/\{first\}/g, p.name.split(' ')[0]), source: 'Website' });

    } else { summary = 'No new reviews'; L.result = 'No new reviews right now.'; }
  } else if (id === 'crm') {
    await step('Fetch customers and orders from Shopify', () => `${S.customers.length} customers`);
    await step('Recalculate lifetime value and segments', () => `${S.customers.filter((c) => c.seg === 'VIP').length} VIP · ${S.customers.filter((c) => c.tags.includes('At risk')).length} at risk`);
    await step('Update CRM profiles', () => 'Done');

  }

}

function viewKnowledge() {
  return `<p class="muted" style="margin:0">Reply drafts follow these policies. Keep them short and specific; changes apply to new drafts.</p>
  <section class="kb">${Object.entries(S.kb).map(([k, v], i) => `<div class="card"><div class="card-h"><h2>${esc(k)}</h2></div><div class="card-b form"><textarea id="kb_${i}" data-kb="${esc(k)}">${esc(v)}</textarea><div class="row"><button class="btn sm pri" type="button" data-savekb="${i}">Save</button></div></div></div>`).join('')}</section>`;
}

// ───────────── Connections ─────────────
function viewConfig() {
  const conns = [['Help desk email', 'support@ inbox · IMAP'], ['Website chat', 'Chat widget webhook'], ['Amazon Seller Central', 'Buyer messages · SP-API'], ['Shopify', 'Customers, orders, reviews'], ['Slack', '#support · #support-urgent'], ['Claude API', 'Classification and reply drafts']];
  return `<section class="cfg">
    <div class="card"><div class="card-h"><h2>Connected channels</h2><small>via n8n credentials</small></div>
      <div class="card-b">${conns.map(([n, d]) => `<div class="conn"><div><b>${n}</b><span>${d}</span></div>${pill('Success', 'Connected')}</div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h2>Routing rules</h2></div><div class="card-b">
      <div class="conn"><div><b>Skin reaction, refund</b><span>Dana (Support lead)</span></div>${pill('High', 'Urgent')}</div>
      <div class="conn"><div><b>Billing error</b><span>Dana + Finance</span></div>${pill('High', 'Urgent')}</div>
      <div class="conn"><div><b>Wholesale inquiry</b><span>Luis (Sales)</span></div>${pill('Medium', 'Lead')}</div>
      <div class="conn"><div><b>Everything else</b><span>Inbox · draft ready</span></div>${pill('Low', 'Normal')}</div></div></div>
    <div class="card"><div class="card-h"><h2>Data</h2></div>
      <div class="card-b form"><span class="muted">Showing sample data. Connect your channels to switch to live conversations.</span>
        <div class="row"><button class="btn sm" type="button" id="resetAll">Reset sample data</button></div></div></div>
  </section>`;
}

// ───────────── Routing & render ─────────────
const VIEWS = { dashboard: viewDashboard, inbox: viewInbox, reviews: viewReviews, customers: viewCustomers, automations: viewAutomations, knowledge: viewKnowledge, config: viewConfig };
const route = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : 'dashboard'; };
function render() {
  const r = route(); renderNav(r); $('#title').textContent = ROUTES.find(([k]) => k === r)[1];
  const focusId = document.activeElement?.id; const caret = document.activeElement?.selectionStart;
  $('#view').innerHTML = VIEWS[r]();
  if (r === 'dashboard') drawChart();
  if (focusId === 'q') { const q = $('#q'); q?.focus(); try { q.setSelectionRange(caret, caret); } catch {} }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => route() === 'dashboard' && drawChart(), 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => route() === 'dashboard' && drawChart());
const tick = () => { $('#clock').textContent = `${wd(Date.now())}, ${md(Date.now())} · ${kt(Date.now())}`; const last = S.runs[S.runs.length - 1]; $('#syncInfo').textContent = last ? `Last sync ${kdt(last.at)}` : ''; };
tick(); setInterval(tick, 30e3);

// ───────────── Events ─────────────
const curConv = () => S.convs.find((x) => x.id === ui.sel);
document.addEventListener('click', async (e) => {
  const t = e.target;
  const open = t.closest('[data-open]'); if (open) { ui.sel = open.dataset.open; ui.filter = 'Open'; if (route() === 'inbox') { e.preventDefault(); render(); } return; }
  const run = t.closest('[data-run]'); if (run) { runWorkflow(run.dataset.run); return; }
  const f = t.closest('[data-filter]'); if (f) { ui.filter = f.dataset.filter; ui.sel = null; render(); return; }
  const cv = t.closest('[data-conv]'); if (cv) { ui.sel = cv.dataset.conv; const c = curConv(); if (c) c.unread = false; save(); render(); return; }
  const tn = t.closest('[data-tone]'); if (tn) { const c = curConv(); c.tone = tn.dataset.tone; delete c.edited; save(); render(); return; }
  const sg = t.closest('[data-seg]'); if (sg) { ui.seg = sg.dataset.seg; render(); return; }
  const pb = t.closest('[data-publish]'); if (pb) { const r = S.reviews.find((x) => x.id === pb.dataset.publish); r.edited = $('#rv_' + r.id).value; r.status = 'Replied'; save(); render(); toast('Reply published.'); return; }
  const sk = t.closest('[data-savekb]'); if (sk) { const ta = $('#kb_' + sk.dataset.savekb); S.kb[ta.dataset.kb] = ta.value; save(); toast('Policy saved. New drafts will follow it.'); return; }
  const id = t.id;
  if (id === 'runTriage') runWorkflow('triage');
  if (id === 'send') { const c = curConv(); const text = $('#draft').value.trim(); if (!text) return toast('The reply is empty.'); c.messages.push({ from: 'out', text, at: Date.now(), by: c.edited != null ? 'Edited before sending' : 'Sent after review' }); c.status = 'Resolved'; c.frt = (Date.now() - c.at) / MIN; save(); render(); toast(`Reply sent to ${cust(c.cid).name}.`); }
  if (id === 'wait') { const c = curConv(); c.status = 'Waiting'; save(); render(); toast('Marked as waiting on the customer.'); }
  if (id === 'resolve') { const c = curConv(); c.status = 'Resolved'; save(); render(); toast('Conversation resolved.'); }
  if (id === 'resetAll') { S = buildState(); Object.keys(live).forEach((k) => delete live[k]); ui.sel = null; save(); location.hash = 'dashboard'; render(); toast('Sample data reset.'); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'draft') { const c = curConv(); if (c) { c.edited = e.target.value; save(); } }
  if (e.target.id === 'q') { ui.q = e.target.value.trim(); render(); }
});
render();
})();
</script>
