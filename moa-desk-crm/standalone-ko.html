<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>모아데스크 CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail (collapses to a top tab strip on phones) + scanning workspace; summary first, detail on demand */
:root{
  --bg:#f2f5f5; --surface:#ffffff; --surface-2:#eaf0ef; --line:#d8e1e0; --fg:#13201e; --muted:#5a6a68;
  --accent:#0d7a69; --accent-ink:#ffffff; --accent-soft:#dcefea; --bar-2:#b9cbc8;
  --ok:#1d8548; --warn:#a96d12; --crit:#c03d29; --info:#2b68cc;
  --c-naver:#17a246; --c-kakao:#a78300; --c-insta:#be2f7f; --c-phone:#56656d; --c-web:#2b68cc;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --rail:228px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1615; --surface:#15201e; --surface-2:#1b2927; --line:#2a3b38; --fg:#e3edeb; --muted:#94a6a3;
  --accent:#3dc0a6; --accent-ink:#05201a; --accent-soft:#163631; --bar-2:#3a4f4b;
  --ok:#4cc27a; --warn:#e2aa45; --crit:#f07c63; --info:#78a7f5;
  --c-naver:#46c96c; --c-kakao:#e3be35; --c-insta:#e56aa9; --c-phone:#9aabb3; --c-web:#78a7f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1615; --surface:#15201e; --surface-2:#1b2927; --line:#2a3b38; --fg:#e3edeb; --muted:#94a6a3;
  --accent:#3dc0a6; --accent-ink:#05201a; --accent-soft:#163631; --bar-2:#3a4f4b;
  --ok:#4cc27a; --warn:#e2aa45; --crit:#f07c63; --info:#78a7f5;
  --c-naver:#46c96c; --c-kakao:#e3be35; --c-insta:#e56aa9; --c-phone:#9aabb3; --c-web:#78a7f5; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-family:var(--mono)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:grid;gap:6px}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

.main{min-width:0;padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:12px}
.topbar h1{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.topbar .spacer{flex:1}
.demo-tag{font-size:12px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:3px 9px;border-radius:99px;white-space:nowrap}
.today{font-size:13px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px}
.panel-h .sub{color:var(--muted);font-size:12px}
.panel-b{padding:14px 16px 16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:24px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--muted);font-family:var(--font);font-weight:500;margin-left:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.kpi.alert .v{color:var(--crit)}
.up{color:var(--ok)} .down{color:var(--crit)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.donut-wrap .center-n{font-family:var(--mono);font-size:22px;font-weight:600;fill:var(--fg)}
.donut-wrap .center-k{font-size:11px;fill:var(--muted)}
.ch-list{display:grid;gap:7px;flex:1;min-width:150px;margin:0;padding:0;list-style:none}
.ch-list li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.ch-list .sw{width:10px;height:10px;border-radius:3px}

.chip{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);white-space:nowrap}
.chip.naver{--c:var(--c-naver)} .chip.kakao{--c:var(--c-kakao)} .chip.insta{--c:var(--c-insta)} .chip.phone{--c:var(--c-phone)} .chip.web{--c:var(--c-web)}
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.p-crit{--c:var(--crit)} .p-ok{--c:var(--ok)} .p-ai{--c:var(--accent)} .p-info{--c:var(--info)} .p-warn{--c:var(--warn)} .p-mute{--c:var(--muted)}
.cat{font-size:12px;color:var(--fg);background:var(--surface-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.urg-긴급{color:var(--crit);font-weight:600} .urg-높음{color:var(--warn);font-weight:600}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}

/* Inbox */
.inbox{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:12px;align-items:start}
.q-list{display:flex;flex-direction:column;max-height:640px;overflow:auto}
.q-item{display:grid;gap:5px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.q-item:hover{background:var(--surface-2)}
.q-item[aria-selected="true"]{background:var(--accent-soft)}
.q-item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-item .name{font-weight:600}
.q-item .time{margin-left:auto;color:var(--muted);font-size:12px}
.q-item .txt{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{display:grid;gap:14px}
.bubble{background:var(--surface-2);border-radius:12px 12px 12px 4px;padding:12px 14px;max-width:560px}
.ai-box{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.ai-box .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--accent);font-weight:600}
.ai-box textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);line-height:1.6}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;font-size:13px}
.meta div{display:grid;gap:2px}
.meta span{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

/* Bookings */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;display:grid;justify-items:center;line-height:1.3;min-width:62px}
.days button b{font-family:var(--mono);font-size:15px}
.days button small{font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.days button[aria-pressed="true"] small{color:var(--accent)}
.days .n{font-size:11px;font-family:var(--mono);color:var(--muted)}
.bk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bk-stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.bk-stat span{font-size:12px;color:var(--muted)}
.bk-stat b{display:block;font-family:var(--mono);font-size:20px}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .t{font-family:var(--mono);font-weight:500;font-size:15px}
.slot .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot .svc{font-size:13px;color:var(--muted)}
.slot .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.remind{font-size:12px;color:var(--muted)}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}

/* Automations */
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rule h3{margin:0 0 6px;font-size:14px}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.flow .when,.flow .then{background:var(--surface-2);border-radius:6px;padding:2px 8px}
.flow .when b,.flow .then b{font-weight:600;color:var(--muted);font-size:11px;margin-right:6px;letter-spacing:.04em}
.flow .arrow{color:var(--muted)}
.rule .runs{font-size:12px;color:var(--muted);margin-top:6px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--bar-2);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.vip{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
.tag.noshow{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.tags{display:flex;gap:4px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1080px){.grid-2{grid-template-columns:minmax(0,1fr)}.inbox{grid-template-columns:minmax(0,1fr)}.q-list{max-height:360px}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .brand small,.rail-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;min-width:0}
  .nav a{padding:7px 10px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .slot{grid-template-columns:52px minmax(0,1fr)}
  .slot .act{grid-column:2;justify-content:flex-start}
}
@media (max-width:520px){.brand b{display:none}.nav a .lbl-long{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark">모</div><div><b>모아데스크</b><small>문의·예약 통합 CRM</small></div></div>
    <nav class="nav" id="nav" aria-label="메뉴">
      <a href="#dashboard" data-v="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>대시보드</a>
      <a href="#inbox" data-v="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H14l-4 4v-4H4z"/></svg><span>통합 문의함</span><span class="count num" id="navCount"></span></a>
      <a href="#bookings" data-v="bookings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>예약 관리</a>
      <a href="#customers" data-v="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>고객 관리</a>
      <a href="#automations" data-v="automations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>자동화<span class="lbl-long"> 규칙</span></span></a>

    <div class="rail-foot">
      <div class="sync"><span class="dot"></span>5개 채널 연결됨</div>

  <main class="main">
    <div class="topbar">

      <span class="today">2026년 11월 6일 (금)</span>
      <span class="demo-tag">데모 · 예시 데이터</span>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CH = {
  naver:{label:'네이버 예약',v:'--c-naver',to:'네이버 예약 메시지로'}, kakao:{label:'카카오톡',v:'--c-kakao',to:'카카오톡으로'},
  insta:{label:'인스타 DM',v:'--c-insta',to:'인스타 DM으로'}, phone:{label:'전화',v:'--c-phone',to:'문자로'}, web:{label:'홈페이지',v:'--c-web',to:'이메일로'}
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => n.toLocaleString('ko-KR') + '원';
const chip = k => `<span class="chip ${k}">${CH[k].label}</span>`;

const inquiries = [

/* ---------- charts ---------- */
function barChart(){
  const W=640,H=230,L=30,R=8,T=12,B=26,n=daily.labels.length,max=16;
  const iw=W-L-R, ih=H-T-B, step=iw/n, bw=step*.6;
  const y=v=>T+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 문의 수: 오늘 ${daily.ai[n-1]+daily.staff[n-1]}건">`;
  [0,4,8,12,16].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  daily.labels.forEach((lb,i)=>{
    const x=L+i*step+(step-bw)/2, a=daily.ai[i], st=daily.staff[i], last=i===n-1;
    s+=`<rect x="${x}" y="${y(a+st)}" width="${bw}" height="${y(a)-y(a+st)}" fill="var(--bar-2)" rx="2"><title>${lb} 직원 응답 ${st}건</title></rect>`;
    s+=`<rect x="${x}" y="${y(a)}" width="${bw}" height="${y(0)-y(a)}" fill="var(--accent)"><title>${lb} AI 자동 응답 ${a}건</title></rect>`;
    if(last) s+=`<text x="${x+bw/2}" y="${y(a+st)-6}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${a+st}</text>`;
    if(i%2===1||last) s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" ${last?'style="fill:var(--fg)"':''}>${last?'오늘':lb}</text>`;
  });
  return s+'</svg>';
}
function donut(){
  const total=Object.values(chMonth).reduce((a,b)=>a+b,0), r=52, C=2*Math.PI*r;
  let off=0, s=`<svg viewBox="0 0 150 150" role="img" aria-label="11월 채널별 문의 분포"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="18"/>`;
  Object.entries(chMonth).forEach(([k,v])=>{const len=v/total*C;
    s+=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="var(${CH[k].v})" stroke-width="18" stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${CH[k].label} ${v}건</title></circle>`; off+=len});
  s+=`<text x="75" y="76" text-anchor="middle" class="center-n">${total}</text><text x="75" y="94" text-anchor="middle" class="center-k">11월 문의</text></svg>`;
  const list=Object.entries(chMonth).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<li><span class="sw" style="background:var(${CH[k].v})"></span><span>${CH[k].label}</span><span class="num">${v}건 · ${Math.round(v/total*100)}%</span></li>`).join('');
  return `<div class="donut-wrap">${s}<ul class="ch-list">${list}</ul></div>`;
}

    <div class="kpi"><span class="k">오늘 문의</span><span class="v">${today.length}<small>건</small></span><span class="d"><span class="up">▲ 2</span> 어제 대비</span></div>
    <div class="kpi"><span class="k">AI 자동 응답</span><span class="v">${Math.round(aiN/today.length*100)}<small>%</small></span><span class="d">오늘 ${aiN}건을 직원 손 없이 처리</span></div>
    <div class="kpi ${un?'alert':''}"><span class="k">미응답</span><span class="v">${un}<small>건</small></span><span class="d">긴급 1건 포함 · 평균 대기 41분</span></div>
    <div class="kpi"><span class="k">오늘 예약</span><span class="v">${bk.length}<small>건</small></span><span class="d">완료 ${done} · 노쇼 ${ns} · 대기 1</span></div>
    <div class="kpi"><span class="k">11월 노쇼율</span><span class="v">3.1<small>%</small></span><span class="d">리마인드 도입 전 9.4%</span></div>
    <div class="kpi"><span class="k">11월 예약 매출</span><span class="v">486<small>만 원</small></span><span class="d">예약 98건 기준</span></div>
  </div>
  <div class="grid-2">
    <section class="panel"><div class="panel-h"><h2>최근 14일 문의</h2><span class="sub">하루 평균 10.6건</span><div style="flex:1"></div><div class="legend"><span><i style="background:var(--accent)"></i>AI 자동 응답</span><span><i style="background:var(--bar-2)"></i>직원 응답</span></div></div>
      <div class="panel-b chart">${barChart()}</div></section>
    <section class="panel"><div class="panel-h"><h2>채널별 문의</h2><span class="sub">11월 1일~6일</span></div><div class="panel-b">${donut()}</div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>최근 문의</h2><span class="sub">행을 누르면 문의함에서 열립니다</span><div style="flex:1"></div><a class="btn" href="#inbox" style="text-decoration:none">문의함 전체 보기</a></div>
    <div class="panel-b table-wrap"><table><thead><tr><th>시간</th><th>채널</th><th>고객</th><th>AI 분류</th><th>내용</th><th>상태</th></tr></thead><tbody>${recent}</tbody></table></div></section>`;
}

function vInbox(){
  const f=state.inbox;
  const list=inquiries.filter(q=>(f.filter==='전체'||q.st===f.filter)&&(f.ch==='all'||q.ch===f.ch)&&(!f.q||(q.name+q.text+q.cat).includes(f.q)));
  if(!list.find(q=>q.id===f.sel)&&list.length) f.sel=list[0].id;
  const sel=inquiries.find(q=>q.id===f.sel);
  const seg=['전체','미응답','AI 응답완료','답변완료'].map(s=>`<button data-f="${s}" aria-pressed="${f.filter===s}">${s}${s==='미응답'?` <span class="num">${unanswered()}</span>`:''}</button>`).join('');
  const chOpts=`<option value="all">모든 채널</option>`+Object.entries(CH).map(([k,c])=>`<option value="${k}" ${f.ch===k?'selected':''}>${c.label}</option>`).join('');
  const items=list.map(q=>`<button class="q-item" data-q="${q.id}" aria-selected="${q.id===f.sel}"><div class="row"><span class="name">${esc(q.name)}</span>${chip(q.ch)}<span class="time num">${q.day==='11-06'?q.t:'어제 '+q.t}</span></div><div class="txt">${esc(q.text)}</div><div class="row"><span class="cat">${q.cat}</span>${q.urg==='긴급'||q.urg==='높음'?`<span class="urg-${q.urg}" style="font-size:12px">${q.urg}</span>`:''}<span style="margin-left:auto">${stPill(q.st)}</span></div></button>`).join('')||`<div class="empty">조건에 맞는 문의가 없습니다.</div>`;
  let detail=`<div class="empty">왼쪽에서 문의를 선택하세요.</div>`;
  if(sel){
    const sent=sel.st!=='미응답';
    detail=`<div class="detail">
      <div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;font-size:18px">${esc(sel.name)}</h2>${chip(sel.ch)}<span class="cat">${sel.cat}</span>${stPill(sel.st)}<span class="note num" style="margin-left:auto">${sel.id}</span></div>
      <div class="meta"><div><span>받은 시간</span>${sel.day==='11-06'?'오늘':'어제'} ${sel.t}</div><div><span>긴급도</span><b class="urg-${sel.urg}">${sel.urg}</b></div><div><span>AI 분류 확신도</span><b class="num">${sel.conf}%</b></div><div><span>담당</span>${sel.staff||(sel.st==='AI 응답완료'?'AI 자동':'미배정')}</div></div>
      ${sel.alert?`<div class="note" style="color:var(--crit)">● ${sel.alert}</div>`:''}
      <div><div class="note" style="margin-bottom:6px">고객 메시지</div><div class="bubble">${esc(sel.text)}</div></div>
      <div class="ai-box"><div class="hd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>${sent?'보낸 답변':'AI 답변 초안'}<span style="font-weight:400;color:var(--muted)">가격표·예약 현황·매장 안내를 참고해 작성</span></div>
        <label for="replyBox" class="note">답변 내용 (수정 가능)</label>
        <textarea id="replyBox" ${sent?'readonly':''}>${esc(sel.ai)}</textarea>
        <div class="toolbar">${sent?`<span class="note">${CH[sel.ch].to} 발송됨</span>`:`<button class="btn primary" id="sendBtn">${CH[sel.ch].to} 답변 보내기</button><select id="assign" class="btn" aria-label="담당자 배정"><option>담당자 배정</option><option>소라 원장</option><option>민재</option><option>하윤</option></select>`}</div>
      </div></div>`;
  }
  return `<div class="toolbar"><div class="seg" id="seg">${seg}</div><select id="chSel" class="btn" aria-label="채널">${chOpts}</select><input id="qSearch" class="search" placeholder="고객명, 내용 검색" value="${esc(f.q)}"></div>
  <div class="inbox"><section class="panel q-list" aria-label="문의 목록">${items}</section><section class="panel panel-b">${detail}</section></div>`;
}

function vBookings(){
  const d=state.day, list=bookings[d]||[], meta=DAYS.find(x=>x[0]===d);
  const days=DAYS.map(([k,w,lab])=>`<button data-d="${k}" aria-pressed="${k===d}"><small>${lab||w+'요일'}</small><b>${k.slice(3)}</b><span class="n">${k==='11-09'?'휴무':(bookings[k]||[]).length+'건'}</span></button>`).join('');
  const cnt=s=>list.filter(b=>b.st===s).length;
  const sales=list.filter(b=>b.st!=='취소'&&b.st!=='노쇼').reduce((a,b)=>a+b.price,0);
  const rows=list.map((b,i)=>{
    const canRemind=b.rm==='예정'&&b.st!=='취소';
    return `<div class="slot"><span class="t">${b.t}</span>
      <div><div class="who"><b>${esc(b.name)}</b>${chip(b.ch)}<span class="pill ${bkPill(b.st)}">${b.st}</span></div>
      <div class="svc">${b.svc} · ${b.who} · <span class="num">${won(b.price)}</span>${b.memo?` · <span style="color:var(--warn)">${esc(b.memo)}</span>`:''}</div></div>
      <div class="act"><span class="remind">리마인드: ${b.rm==='예정'?'오늘 18:00 예정':b.rm}</span>${canRemind?`<button class="btn" data-rm="${i}">지금 보내기</button>`:''}
      ${b.st==='확정'&&d==='11-06'?`<button class="btn" data-done="${i}">방문 완료</button>`:''}</div></div>`}).join('');
  const body=d==='11-09'?`<div class="empty">매주 월요일은 정기 휴무입니다. 이 날짜로 들어온 예약 문의는 AI가 화요일 일정을 제안합니다.</div>`:(rows||`<div class="empty">예약이 없습니다.</div>`);
  return `<div class="days" id="days">${days}</div>
  <div class="bk-stats"><div class="bk-stat"><span>전체 예약</span><b>${list.length}</b></div><div class="bk-stat"><span>확정</span><b>${cnt('확정')}</b></div><div class="bk-stat"><span>대기 (예약금)</span><b>${cnt('대기')}</b></div><div class="bk-stat"><span>완료</span><b>${cnt('완료')}</b></div><div class="bk-stat"><span>노쇼</span><b style="color:${cnt('노쇼')?'var(--crit)':'inherit'}">${cnt('노쇼')}</b></div><div class="bk-stat"><span>예상 매출</span><b>${(sales/10000).toLocaleString('ko-KR')}<small style="font-size:12px">만 원</small></b></div></div>
  <section class="panel"><div class="panel-h"><h2>11월 ${+d.slice(3)}일 (${meta[1]}) 예약</h2><span class="sub">네이버 예약 · 카카오톡 · 인스타 · 전화 · 홈페이지 예약을 한곳에</span></div><div class="panel-b">${body}</div></section>`;
}

function vCustomers(){
  const c=state.cust, tags=['전체','VIP','재방문','신규','45일 미방문','노쇼 2회'];
  const list=customers.filter(x=>(c.tag==='전체'||x.tags.includes(c.tag))&&(!c.q||(x.name+x.phone).includes(c.q)));
  const tagHtml=t=>`<span class="tag ${t==='VIP'?'vip':''} ${/노쇼|예약금|클레임/.test(t)?'noshow':''}">${t}</span>`;
  const rows=list.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="num">${x.phone}</td><td>${chip(x.ch)}</td><td class="r num">${x.visits}회</td><td class="num">${x.last}</td><td class="r num">${won(x.spend)}</td><td>${x.who}</td><td><div class="tags">${x.tags.map(tagHtml).join('')}</div></td></tr>`).join('')||`<tr><td colspan="8" class="empty">조건에 맞는 고객이 없습니다.</td></tr>`;
  return `<div class="toolbar"><div class="seg" id="tagSeg">${tags.map(t=>`<button data-t="${t}" aria-pressed="${c.tag===t}">${t}</button>`).join('')}</div><input id="cSearch" class="search" placeholder="이름, 전화번호 검색" value="${esc(c.q)}"></div>
  <section class="panel"><div class="panel-h"><h2>고객 ${list.length}명</h2><span class="sub">채널이 달라도 전화번호로 같은 고객을 하나로 합칩니다</span></div>
  <div class="panel-b table-wrap"><table><thead><tr><th>고객</th><th>연락처</th><th>첫 유입</th><th class="r">방문</th><th>최근 방문</th><th class="r">누적 결제</th><th>담당</th><th>태그</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function vAutomations(){
  const on=rules.filter(r=>r.on).length, total=rules.reduce((a,r)=>a+r.runs,0);
  return `<div class="kpis"><div class="kpi"><span class="k">켜진 자동화</span><span class="v">${on}<small>/ ${rules.length}</small></span></div><div class="kpi"><span class="k">최근 30일 실행</span><span class="v">${total}<small>회</small></span></div><div class="kpi"><span class="k">아낀 응대 시간 (추정)</span><span class="v">${Math.round(total*3/60)}<small>시간</small></span><span class="d">1회 평균 3분 기준</span></div></div>
  <div class="rules">${rules.map((r,i)=>`<div class="rule"><div><h3>${r.name}</h3><div class="flow"><span class="when"><b>조건</b>${r.when}</span><span class="arrow">→</span><span class="then"><b>실행</b>${r.then}</span></div><div class="runs">${r.on?`최근 30일 <span class="num">${r.runs}</span>회 실행`:'꺼져 있음'}</div></div>
  <label class="switch"><input type="checkbox" id="rule${i}" data-rule="${i}" ${r.on?'checked':''} aria-label="${r.name} 켜기/끄기"><span></span></label></div>`).join('')}</div>`;
}

const VIEWS={dashboard:['대시보드',vDashboard],inbox:['통합 문의함',vInbox],bookings:['예약 관리',vBookings],customers:['고객 관리',vCustomers],automations:['자동화 규칙',vAutomations]};

function render(){
  let v=location.hash.slice(1); if(!VIEWS[v]) v='dashboard';
  document.getElementById('viewTitle').textContent=VIEWS[v][0];
  const el=document.getElementById('view'); el.innerHTML=VIEWS[v][1](); el.style.display='flex'; el.style.flexDirection='column'; el.style.gap='14px';
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===v?'page':'false'));
  updateNav(); bind(v);
}

function bind(v){
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  if(v==='dashboard'){ $$('tr[data-q]').forEach(tr=>tr.onclick=()=>{state.inbox.sel=tr.dataset.q;state.inbox.filter='전체';location.hash='inbox'}); }
  if(v==='inbox'){
    $$('#seg button').forEach(b=>b.onclick=()=>{state.inbox.filter=b.dataset.f;render()});
    $('#chSel').onchange=e=>{state.inbox.ch=e.target.value;render()};
    const s=$('#qSearch'); s.oninput=e=>{state.inbox.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#qSearch');n.focus();n.setSelectionRange(pos,pos)};
    $$('.q-item').forEach(b=>b.onclick=()=>{state.inbox.sel=b.dataset.q;render()});
    const send=$('#sendBtn');
    if(send) send.onclick=()=>{const q=inquiries.find(x=>x.id===state.inbox.sel);q.ai=$('#replyBox').value;q.st='답변완료';const a=$('#assign');q.staff=a&&a.selectedIndex>0?a.value:'소라 원장';render();toast(`${CH[q.ch].to} 답변을 보냈습니다 (데모라 실제 발송은 없습니다)`)};
  }
  if(v==='bookings'){
    $$('#days button').forEach(b=>b.onclick=()=>{state.day=b.dataset.d;render()});
    $$('[data-rm]').forEach(b=>b.onclick=()=>{bookings[state.day][+b.dataset.rm].rm='발송완료';render();toast('리마인드 알림톡을 보냈습니다 (데모)')});
    $$('[data-done]').forEach(b=>b.onclick=()=>{bookings[state.day][+b.dataset.done].st='완료';render();toast('방문 완료로 바꿨습니다')});
  }
  if(v==='customers'){
    $$('#tagSeg button').forEach(b=>b.onclick=()=>{state.cust.tag=b.dataset.t;render()});
    $('#cSearch').oninput=e=>{state.cust.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#cSearch');n.focus();n.setSelectionRange(pos,pos)};
  }
  if(v==='automations'){
    $$('[data-rule]').forEach(c=>c.onchange=()=>{const r=rules[+c.dataset.rule];r.on=c.checked;render();toast(`'${r.name}' 자동화를 ${r.on?'켰습니다':'껐습니다'}`)});
  }
}
window.addEventListener('hashchange',render);
render();
</script>

</body>
</html>
