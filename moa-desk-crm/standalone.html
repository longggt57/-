<body>
<title>MoaDesk CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: white workspace, fixed left rail (top tab strip on phones); summary first, detail on demand. Single light theme by design. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f2f6f5; --line:#e2e9e8; --fg:#13201e; --muted:#5a6a68;
  --accent:#0d7a69; --accent-ink:#ffffff; --accent-soft:#e3f3ef; --bar-2:#c3d3d0;
  --ok:#1d8548; --warn:#a96d12; --crit:#c03d29; --info:#2b68cc;
  --c-book:#2b68cc; --c-wa:#17a246; --c-insta:#be2f7f; --c-phone:#56656d; --c-web:#7a52c7;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --rail:228px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-family:var(--mono)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:grid;gap:6px}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

.main{min-width:0;padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:12px}
.topbar h1{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.topbar .spacer{flex:1}
.demo-tag{font-size:12px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);padding:3px 9px;border-radius:99px;white-space:nowrap}
.today{font-size:13px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px}
.panel-h .sub{color:var(--muted);font-size:12px}
.panel-b{padding:14px 16px 16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:24px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--muted);font-family:var(--font);font-weight:500;margin-left:3px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.kpi.alert .v{color:var(--crit)}
.up{color:var(--ok)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.donut-wrap .center-n{font-family:var(--mono);font-size:22px;font-weight:600;fill:var(--fg)}
.donut-wrap .center-k{font-size:11px;fill:var(--muted)}
.ch-list{display:grid;gap:7px;flex:1;min-width:170px;margin:0;padding:0;list-style:none}
.ch-list li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.ch-list .sw{width:10px;height:10px;border-radius:3px}

.chip{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent);white-space:nowrap}
.chip.book{--c:var(--c-book)} .chip.wa{--c:var(--c-wa)} .chip.insta{--c:var(--c-insta)} .chip.phone{--c:var(--c-phone)} .chip.web{--c:var(--c-web)}
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.p-crit{--c:var(--crit)} .p-ok{--c:var(--ok)} .p-ai{--c:var(--accent)} .p-info{--c:var(--info)} .p-warn{--c:var(--warn)} .p-mute{--c:var(--muted)}
.cat{font-size:12px;color:var(--fg);background:var(--surface-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.urg-Urgent{color:var(--crit);font-weight:600} .urg-High{color:var(--warn);font-weight:600}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}

.inbox{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:12px;align-items:start}
.q-list{display:flex;flex-direction:column;max-height:640px;overflow:auto}
.q-item{display:grid;gap:5px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.q-item:hover{background:var(--surface-2)}
.q-item[aria-selected="true"]{background:var(--accent-soft)}
.q-item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-item .name{font-weight:600}
.q-item .time{margin-left:auto;color:var(--muted);font-size:12px}
.q-item .txt{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{display:grid;gap:14px}
.bubble{background:var(--surface-2);border-radius:12px 12px 12px 4px;padding:12px 14px;max-width:560px}
.ai-box{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.ai-box .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--accent);font-weight:600}
.ai-box textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);line-height:1.6}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;font-size:13px}
.meta div{display:grid;gap:2px}
.meta span{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;display:grid;justify-items:center;line-height:1.3;min-width:66px}
.days button b{font-family:var(--mono);font-size:15px}
.days button small{font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.days button[aria-pressed="true"] small{color:var(--accent)}
.days .n{font-size:11px;font-family:var(--mono);color:var(--muted)}
.bk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bk-stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.bk-stat span{font-size:12px;color:var(--muted)}
.bk-stat b{display:block;font-family:var(--mono);font-size:20px}
.slot{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .t{font-family:var(--mono);font-weight:500;font-size:14px}
.slot .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot .svc{font-size:13px;color:var(--muted)}
.slot .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.remind{font-size:12px;color:var(--muted)}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}

.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rule h3{margin:0 0 6px;font-size:14px}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.flow .when,.flow .then{background:var(--surface-2);border-radius:6px;padding:2px 8px}
.flow .when b,.flow .then b{font-weight:600;color:var(--muted);font-size:11px;margin-right:6px;letter-spacing:.06em}
.flow .arrow{color:var(--muted)}
.rule .runs{font-size:12px;color:var(--muted);margin-top:6px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--bar-2);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.vip{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600}
.tag.noshow{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}
.tags{display:flex;gap:4px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1080px){.grid-2{grid-template-columns:minmax(0,1fr)}.inbox{grid-template-columns:minmax(0,1fr)}.q-list{max-height:360px}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .brand small,.rail-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;min-width:0}
  .nav a{padding:7px 10px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .slot{grid-template-columns:66px minmax(0,1fr)}
  .slot .act{grid-column:2;justify-content:flex-start}
}
@media (max-width:520px){.brand b{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark">M</div><div><b>MoaDesk</b><small>Inquiries + Bookings CRM</small></div></div>

      <a href="#inbox" data-v="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H14l-4 4v-4H4z"/></svg><span>Inbox</span><span class="count num" id="navCount"></span></a>
      <a href="#bookings" data-v="bookings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bookings</a>
      <a href="#customers" data-v="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>Customers</a>
      <a href="#automations" data-v="automations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Automations</a>
    </nav>
    <div class="rail-foot">
      <div class="sync"><span class="dot"></span>5 channels connected</div>
      <div>Last synced 2:25 PM</div>

  </aside>

  <main class="main">
    <div class="topbar">
      <div><div class="crumb">Moa Hair Studio · Brooklyn</div><h1 id="viewTitle">Dashboard</h1></div>
      <div class="spacer"></div>
      <span class="today">Fri, Nov 6, 2026</span>
      <span class="demo-tag">Demo · sample data</span>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CH = {
  book:{label:'Online booking',v:'--c-book',to:'Send via booking app'},

};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + n.toLocaleString('en-US');
const chip = k => `<span class="chip ${k}">${CH[k].label}</span>`;

const inquiries = [
 {id:'Q-1042',day:'today',t:'2:22 PM',name:'Emma K.',ch:'wa',cat:'Booking request',urg:'Normal',st:'Unanswered',text:'Hi! Could I get a cut and blow-dry tomorrow around 3pm? Ideally with Sora.',ai:'Hi Emma, thanks for reaching out to Moa Hair Studio! Sora has an opening tomorrow (Sat, Nov 7) at 3:00 PM for a cut and blow-dry ($65). Reply YES and we\'ll lock it in. You\'ll get a reminder the evening before.',conf:94},
 {id:'Q-1041',day:'today',t:'1:58 PM',name:'Jake P.',ch:'insta',cat:'Pricing',urg:'Normal',st:'AI replied',text:'How much is a root touch-up?',ai:'A root touch-up starts at $85 for any hair length. If your hair needs extra care, we may suggest adding a treatment. You can book directly from the link in our bio.',conf:97},
 {id:'Q-1040',day:'today',t:'1:31 PM',name:'Olivia L.',ch:'book',cat:'Reschedule',urg:'High',st:'Unanswered',text:'I have a 5pm appointment today but I\'m running 30 min late. Is that ok?',ai:'Thanks for the heads-up, Olivia. We\'ve moved your appointment to 5:30 PM today and adjusted Hana\'s schedule so nothing overlaps. See you soon!',conf:88},
 {id:'Q-1039',day:'today',t:'12:47 PM',name:'Rachel C.',ch:'phone',cat:'Complaint',urg:'Urgent',st:'Unanswered',text:'(Call note) Says her perm from last week is already falling out. Wants it redone. Sounded upset.',ai:'Hi Rachel, we\'re sorry about this. If a perm drops within 2 weeks, we redo it free of charge. Sora will check your hair personally and call you back today to set a time.',conf:81,alert:'Urgent alert sent to the owner\'s phone (12:47 PM)'},
 {id:'Q-1038',day:'today',t:'11:20 AM',name:'Daniel J.',ch:'web',cat:'Consultation',urg:'Normal',st:'Replied',text:'I\'ve bleached twice. Can I still go blue-black?',ai:'Yes, blue-black works on twice-bleached hair. To keep the color from fading fast, we recommend adding a treatment. Come in for a quick consultation and we\'ll give you an exact quote.',conf:90,staff:'Min'},
 {id:'Q-1037',day:'today',t:'10:55 AM',name:'Sophie H.',ch:'wa',cat:'Location & parking',urg:'Low',st:'AI replied',text:'Is there parking nearby?',ai:'Yes! There\'s a public garage next door, and we validate 1 hour of parking. Just bring your ticket to the front desk.',conf:99},
 {id:'Q-1036',day:'today',t:'10:12 AM',name:'Ava Y.',ch:'book',cat:'Booking request',urg:'Normal',st:'AI replied',text:'Any keratin smoothing slots Saturday morning?',ai:'You\'re booked with Sora on Saturday, Nov 7 at 10:00 AM for keratin smoothing ($220, about 2.5 hours). See you then!',conf:95},
 {id:'Q-1035',day:'today',t:'9:40 AM',name:'Ryan K.',ch:'insta',cat:'Pricing',urg:'Low',st:'AI replied',text:'price for men\'s cut?',ai:'A men\'s cut is $35, or $50 with a beard trim.',conf:98},
 {id:'Q-1034',day:'today',t:'9:05 AM',name:'Chloe J.',ch:'wa',cat:'Booking request',urg:'Normal',st:'Replied',text:'Can I come in for a haircut at 10 today?',ai:'Min has a 10:00 AM opening today for a haircut. You\'re all set!',conf:93,staff:'Min'},
 {id:'Q-1033',day:'yesterday',t:'9:48 PM',name:'Grace S.',ch:'web',cat:'Consultation',urg:'Normal',st:'AI replied',text:'My hair is very frizzy. Keratin or a silk press, which is better?',ai:'For long-lasting frizz control, keratin smoothing is the better pick. A silk press gives a sleek look for about a week. Send us a photo and a stylist will recommend the best option.',conf:84},
 {id:'Q-1032',day:'yesterday',t:'7:30 PM',name:'Mia L.',ch:'phone',cat:'Reschedule',urg:'High',st:'Replied',text:'(Call note) Wants to move Saturday\'s appointment to next Wednesday.',ai:'Done! Your appointment is now on Wednesday, Nov 11 at 12:00 PM.',conf:91,staff:'Hana'},
 {id:'Q-1031',day:'yesterday',t:'6:02 PM',name:'Noah O.',ch:'wa',cat:'Pricing',urg:'Low',st:'AI replied',text:'Can I book a treatment on its own? How much?',ai:'Yes, a standalone treatment is $70. Add it to any color or perm service and it\'s 20% off.',conf:96}
];

const bookings = {

function barChart(){
  const W=640,H=230,L=30,R=8,T=12,B=26,n=daily.labels.length,max=16;
  const iw=W-L-R, ih=H-T-B, step=iw/n, bw=step*.6;
  const y=v=>T+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Inquiries over the last 14 days: ${daily.ai[n-1]+daily.staff[n-1]} today">`;
  [0,4,8,12,16].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  daily.labels.forEach((lb,i)=>{
    const x=L+i*step+(step-bw)/2, a=daily.ai[i], st=daily.staff[i], last=i===n-1;
    s+=`<rect x="${x}" y="${y(a+st)}" width="${bw}" height="${y(a)-y(a+st)}" fill="var(--bar-2)" rx="2"><title>${lb}: ${st} answered by staff</title></rect>`;
    s+=`<rect x="${x}" y="${y(a)}" width="${bw}" height="${y(0)-y(a)}" fill="var(--accent)"><title>${lb}: ${a} answered by AI</title></rect>`;
    if(last) s+=`<text x="${x+bw/2}" y="${y(a+st)-6}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${a+st}</text>`;
    if(i%2===1||last) s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" ${last?'style="fill:var(--fg)"':''}>${last?'Today':lb}</text>`;
  });
  return s+'</svg>';
}
function donut(){
  const total=Object.values(chMonth).reduce((a,b)=>a+b,0), r=52, C=2*Math.PI*r;
  let off=0, s=`<svg viewBox="0 0 150 150" role="img" aria-label="November inquiries by channel"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="18"/>`;
  Object.entries(chMonth).forEach(([k,v])=>{const len=v/total*C;
    s+=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="var(${CH[k].v})" stroke-width="18" stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${CH[k].label}: ${v}</title></circle>`; off+=len});
  s+=`<text x="75" y="76" text-anchor="middle" class="center-n">${total}</text><text x="75" y="94" text-anchor="middle" class="center-k">in November</text></svg>`;
  const list=Object.entries(chMonth).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<li><span class="sw" style="background:var(${CH[k].v})"></span><span>${CH[k].label}</span><span class="num">${v} · ${Math.round(v/total*100)}%</span></li>`).join('');
  return `<div class="donut-wrap">${s}<ul class="ch-list">${list}</ul></div>`;
}

function bind(v){
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  if(v==='dashboard'){ $$('tr[data-q]').forEach(tr=>tr.onclick=()=>{state.inbox.sel=tr.dataset.q;state.inbox.filter='All';location.hash='inbox'}); }
  if(v==='inbox'){
    $$('#seg button').forEach(b=>b.onclick=()=>{state.inbox.filter=b.dataset.f;render()});
    $('#chSel').onchange=e=>{state.inbox.ch=e.target.value;render()};
    $('#qSearch').oninput=e=>{state.inbox.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#qSearch');n.focus();n.setSelectionRange(pos,pos)};
    $$('.q-item').forEach(b=>b.onclick=()=>{state.inbox.sel=b.dataset.q;render()});
    const send=$('#sendBtn');
    if(send) send.onclick=()=>{const q=inquiries.find(x=>x.id===state.inbox.sel);q.ai=$('#replyBox').value;q.st='Replied';const a=$('#assign');q.staff=a&&a.selectedIndex>0?a.value:'Sora (owner)';render();toast(`Reply sent via ${CH[q.ch].label} (demo: nothing is actually sent)`)};
  }
  if(v==='bookings'){
    $$('#days button').forEach(b=>b.onclick=()=>{state.day=b.dataset.d;render()});
    $$('[data-rm]').forEach(b=>b.onclick=()=>{bookings[state.day][+b.dataset.rm].rm='Sent';render();toast('Reminder sent (demo)')});
    $$('[data-done]').forEach(b=>b.onclick=()=>{bookings[state.day][+b.dataset.done].st='Completed';render();toast('Marked as completed')});
  }
  if(v==='customers'){
    $$('#tagSeg button').forEach(b=>b.onclick=()=>{state.cust.tag=b.dataset.t;render()});
    $('#cSearch').oninput=e=>{state.cust.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#cSearch');n.focus();n.setSelectionRange(pos,pos)};
  }
  if(v==='automations'){
    $$('[data-rule]').forEach(c=>c.onchange=()=>{const r=rules[+c.dataset.rule];r.on=c.checked;render();toast(`"${r.name}" turned ${r.on?'on':'off'}`)});
  }
}
window.addEventListener('hashchange',render);
render();
</script>

</body>
</html>
